(function bindRvSystemBar() {
  const bar = document.getElementById('rv-sys-bar');
  if (!bar) return;
  bar.addEventListener('click', async (event) => {
    const btn = event.target.closest('[data-sys]');
    if (!btn) return;
    const act = btn.dataset.sys;
    const em = window.EJS_emulator;
    const gm = em && em.gameManager;
    try {
      if (act === 'save') {
        await rvSaveNow(); // a barra fica aberta: a linha de info atualiza na hora
      } else if (act === 'load') {
        await rvLoadNow();
      } else if (act === 'delete') {
        await rvSaveDel(rvSaveKey());
        if (rvCloudOn()) { RVAccount.deleteCloudSave(rvSaveKey()).catch(() => {}); }
        if (typeof showToast === 'function') showToast('Save apagado', 'check');
        refreshRvSaveInfo();
      } else if (act === 'reset') {
        if (gm && gm.restart) { gm.restart(); if (typeof showToast === 'function') showToast('Jogo reiniciado'); }
        closeRvSystemBar();
      } else if (act === 'exit') {
        window.location.href = 'index.html';
      } else if (act === 'close') {
        closeRvSystemBar();
      } else if (act === 'turbo') {
        if (gm && gm.toggleFastForward) {
          const isOn = !!em.isFastForward;
          gm.toggleFastForward(isOn ? 0 : 1);
          em.isFastForward = !isOn;
          if (typeof showToast === 'function') showToast(isOn ? 'Turbo desligado' : 'Turbo ligado');
        }
        syncRvSysBarState();
      }
    } catch (err) { console.warn('[RetroVault Web] barra de sistema:', err); }
  });
})();

// O botão hambúrguer usado no modo touch (ejs_virtualGamepad_open)
// chama menu.toggle() internamente e não passa por EJS_Buttons.contextMenu.
// Interceptamos esse botão para abrir os cheats diretamente.
function bindEmulatorMenuToCheats() {
  const emulator = window.EJS_emulator;
  if (!emulator) return false;

  // O botão hambúrguer chama este método internamente. Redirecionar o método
  // também cobre versões do EmulatorJS que recriam o botão touch dinamicamente.
  if (emulator.menu && !emulator.menu.__rvCheatsRedirected) {
    emulator.menu.toggle = () => openRvCheats();
    emulator.menu.__rvCheatsRedirected = true;
  }

  const menuButton = emulator.elements?.menuToggle
    || document.querySelector('.ejs_virtualGamepad_open');
  if (!menuButton || menuButton.dataset.rvCheatsMenuBound === '1') return true;

  let lastHandled = 0;
  const redirect = (event) => {
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    // Um toque dispara touchstart, touchend e click; abre apenas uma vez.
    const now = Date.now();
    if (now - lastHandled < 450) return;
    lastHandled = now;
    openRvCheats();
  };

  ['touchstart', 'touchend', 'mousedown', 'mouseup', 'click'].forEach(type => {
    menuButton.addEventListener(type, redirect, { capture: true, passive: false });
  });
  menuButton.dataset.rvCheatsMenuBound = '1';
  menuButton.setAttribute('aria-label', 'Cheats');
  menuButton.title = 'Cheats';
  return true;
}

EJS_Buttons = {
  // Evita exibir dois botões para a mesma função.
  cheat: false,
  contextMenu: {
    visible: true,
    displayName: 'Cheats',
    callback: openRvCheats
  }
};

// Usa o nome base da ROM para aumentar a precisão do matching no JSON.
try {
  const romFilename = decodeURIComponent((game || '').split('/').pop() || '');
  // Como EJS_gameUrl é um blob, o EmulatorJS grava a ROM no FS virtual usando
  // EJS_gameName como nome do arquivo. Formatos de ARCADE (.zip) e de DISCO
  // (.chd) precisam manter a extensão: o FBNeo não reconhece romsets sem .zip
  // e o RetroArch identifica imagens de CD pela extensão — sem ela o núcleo
  // falha ao carregar o conteúdo e cai no Main Menu. Cartuchos mantêm o nome
  // sem extensão (preserva as chaves de save existentes).
  EJS_gameName = /\.(zip|chd)$/i.test(romFilename) ? romFilename : romFilename.replace(/\.[^/.]+$/, '');
} catch (e) {}

EJS_startOnLoaded = true; EJS_fullscreenOnLoaded = false;

/* ═════════ EXTRAS DO JOGO (rv-extras) ═════════
   Tempo de jogo, continuar de onde parou, clipe, cartucho (SRM),
   ROM no offline, portão dos pais e aviso de atualização.
   Bloco independente: nada aqui altera os menus existentes. */
(function () {
  'use strict';
  const $id = (i) => document.getElementById(i);
  const consoleKey = (((typeof game === 'string' ? game : '') || '').split('?')[0].split('/')[0]) || '';
  const gkey = (((typeof game === 'string' ? game : '') || '').split('?')[0]) || '';
  const hojeChave = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  /* ── 1. PORTÃO DOS PAIS (config.html → Controle dos pais) ──
     Chamado pelo leitor de preferências logo abaixo: se o console
     está fora da lista liberada, o jogo só abre depois do PIN. */
  window.__rvParentalGate = function (cfg) {
    const pin = cfg && typeof cfg.parentPin === 'string' ? cfg.parentPin : '';
    const liberados = Array.isArray(cfg.parentConsoles) ? cfg.parentConsoles : [];
    if (!pin || !liberados.length || liberados.indexOf(consoleKey) >= 0) return false;
    const nomeConsole = consoleKey ? consoleKey.toUpperCase() : 'CONSOLE';

    const ov = document.createElement('div'); ov.id = 'rv-gate';
    const box = document.createElement('div'); box.className = 'rv-gate-box';
    const h = document.createElement('h3');
    const hIco = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    hIco.setAttribute('viewBox', '0 0 24 24'); hIco.setAttribute('fill', 'none');
    hIco.setAttribute('stroke', '#00ff41'); hIco.setAttribute('stroke-width', '2');
    hIco.setAttribute('stroke-linecap', 'round'); hIco.setAttribute('stroke-linejoin', 'round');
    hIco.setAttribute('aria-hidden', 'true');
    hIco.innerHTML = '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3" fill="#00ff41" stroke="none"/>';
    h.appendChild(hIco); h.appendChild(document.createTextNode('Controle dos pais'));
    const p = document.createElement('p');
    const b1 = document.createElement('b'); b1.textContent = nomeConsole;
    p.appendChild(b1); p.appendChild(document.createTextNode(' está protegido por PIN. Digite os 4 dígitos para jogar.'));
    const dots = document.createElement('div'); dots.className = 'rv-gate-dots'; dots.textContent = '····';
    const pad = document.createElement('div'); pad.className = 'rv-gate-pad';
    const err = document.createElement('p'); err.className = 'rv-gate-err';
    box.appendChild(h); box.appendChild(p); box.appendChild(dots); box.appendChild(pad); box.appendChild(err);
    ov.appendChild(box); document.body.appendChild(ov);

    let val = '';
    const pinta = () => { dots.textContent = '•'.repeat(val.length) + '·'.repeat(Math.max(0, 4 - val.length)); };
    async function conferir() {
      let hash;
      try {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rv-parent:' + val));
        hash = 's#' + Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
      } catch (e) { hash = 'p#' + val; }
      if (hash === pin) {
        ov.remove();
        if (typeof showToast === 'function') showToast('Acesso liberado', 'check');
        /* startOnLoaded foi desligado pelo portão: clica no iniciar assim que existir */
        let n = 0;
        const iv = setInterval(() => {
          const botao = document.querySelector('.ejs_start_button');
          if (botao) { clearInterval(iv); botao.click(); }
          else if (++n > 240) clearInterval(iv); /* ROMs lentas: espera até 2min */
        }, 500);
      } else {
        err.textContent = 'PIN incorreto — tente de novo';
        val = ''; pinta();
        setTimeout(() => { err.textContent = ''; }, 2200);
      }
    }
    function tecla(k) {
      if (k === '⌫') { val = val.slice(0, -1); pinta(); return; }
      if (k === 'OK') { if (val.length === 4) conferir(); return; }
      if (val.length < 4) { val += k; pinta(); if (val.length === 4) setTimeout(conferir, 180); }
    }
    [1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].forEach(k => {
      const b = document.createElement('button'); b.type = 'button';
      if (k === '⌫') {
        b.setAttribute('aria-label', 'Apagar último dígito');
        const bi = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        bi.setAttribute('viewBox', '0 0 24 24'); bi.setAttribute('fill', 'none');
        bi.setAttribute('stroke', 'currentColor'); bi.setAttribute('stroke-width', '2');
        bi.setAttribute('stroke-linecap', 'round'); bi.setAttribute('stroke-linejoin', 'round');
        bi.innerHTML = '<path d="M22 5H9l-7 7 7 7h13a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="12" y1="9" x2="18" y2="15"/><line x1="18" y1="9" x2="12" y2="15"/>';
        b.appendChild(bi);
        b.addEventListener('click', () => tecla('⌫'));
      } else {
        b.textContent = String(k);
        b.addEventListener('click', () => tecla(k));
      }
      pad.appendChild(b);
    });
    return true; /* bloqueado: o leitor desliga o auto-start */
  };

  /* ── 2. TEMPO DE JOGO (rv_playtime + rv_activity) ── */
  window.__rvTrackCfg = { on: true };
  let pendenteMs = 0, ultimoTick = Date.now();
  function flushTempo() {
    if (pendenteMs < 1000) return;
    const secs = Math.round(pendenteMs / 1000);
    pendenteMs = 0;
    try {
      if (!gkey) return;
      const m = JSON.parse(RVStore.getItem('rv_playtime') || '{}');
      m[gkey] = (m[gkey] || 0) + secs;
      RVStore.setItem('rv_playtime', JSON.stringify(m));
      const a = JSON.parse(RVStore.getItem('rv_activity') || '{}');
      const h = hojeChave();
      a[h] = (a[h] || 0) + secs;
      RVStore.setItem('rv_activity', JSON.stringify(a));
    } catch (e) { }
  }
  setInterval(() => {
    const agora = Date.now();
    const dt = agora - ultimoTick; ultimoTick = agora;
    if (!window.__rvTrackCfg.on) return;
    const em = window.EJS_emulator;
    if (!em || !em.started || em.paused) return;
    if (document.visibilityState !== 'visible') return;
    pendenteMs += dt;
    if (pendenteMs >= 30000) flushTempo();
  }, 5000);

  /* ── 3. CONTINUAR DE ONDE PAROU (estado automático) ── */
  const autoKey = () => 'rv-auto::' + rvSaveKey();
  let resumePerguntado = false;
  async function capturarAuto() {
    const em = window.EJS_emulator, gm = em && em.gameManager;
    if (!em || !em.started || !gm || typeof gm.getState !== 'function') return;
    if (em.paused) return; /* pausado: o jogo já está parado */
    try {
      const congelou = rvFreezeCore();
      let st;
      try { if (congelou) await rvTick(60); st = await Promise.resolve(gm.getState()); }
      finally { if (congelou) rvUnfreezeCore(); }
      const len = st ? (st.byteLength || st.length || 0) : 0;
      if (!len) return;
      await rvSavePut(autoKey(), {
        game: rvSaveKey(), rom: rvGameLabel(), core: (typeof core === 'string' ? core : ''),
        bytes: len, savedAt: new Date().toISOString(),
        state: st instanceof Uint8Array ? st : new Uint8Array(st), auto: true
      });
    } catch (e) { /* silencioso: é só o ponto de retomada */ }
  }
  let ultimaCaptura = 0;
  function capturarAutoComFolga() {
    const agora = Date.now();
    if (agora - ultimaCaptura < 20000) return;
    ultimaCaptura = agora;
    capturarAuto();
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { capturarAuto(); flushTempo(); } });
  globalThis.addEventListener('pagehide', () => { try { capturarAuto(); flushTempo(); } catch (e) { } });
  setInterval(() => { if (document.visibilityState === 'visible') capturarAutoComFolga(); }, 120000);
  /* Sair pela barra de sistema também captura antes de navegar. */
  document.addEventListener('click', (ev) => {
    const b = ev.target && ev.target.closest && ev.target.closest('[data-sys="exit"]');
    if (b) { capturarAuto(); flushTempo(); }
  }, true);
  window.__rvAutoCapture = capturarAuto;

  function montarBarraResume(rec) {
    const barra = document.createElement('div'); barra.id = 'rv-resume';
    const txt = document.createElement('div'); txt.className = 'rv-resume-txt';
    const strong = document.createElement('strong'); strong.textContent = 'Continuar de onde parou?';
    const small = document.createElement('small');
    small.textContent = rvGameLabel() + ' · salvo em ' + rvFmtDate(rec.savedAt);
    txt.appendChild(strong); txt.appendChild(small);
    const go = document.createElement('button'); go.type = 'button'; go.className = 'rv-resume-go';
    const goIco = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    goIco.setAttribute('viewBox', '0 0 24 24'); goIco.setAttribute('fill', 'currentColor');
    goIco.setAttribute('aria-hidden', 'true');
    goIco.innerHTML = '<polygon points="7 4 20 12 7 20"/>';
    go.appendChild(goIco); go.appendChild(document.createTextNode('Retomar'));
    const no = document.createElement('button'); no.type = 'button';
    const noIco = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    noIco.setAttribute('viewBox', '0 0 24 24'); noIco.setAttribute('fill', 'none');
    noIco.setAttribute('stroke', 'currentColor'); noIco.setAttribute('stroke-width', '2');
    noIco.setAttribute('stroke-linecap', 'round'); noIco.setAttribute('aria-hidden', 'true');
    noIco.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
    no.appendChild(noIco); no.appendChild(document.createTextNode('Do zero'));
    barra.appendChild(txt); barra.appendChild(go); barra.appendChild(no);
    document.body.appendChild(barra);
    requestAnimationFrame(() => barra.classList.add('visible'));
    go.addEventListener('click', async () => {
      go.disabled = true;
      try {
        const em = window.EJS_emulator, gm = em && em.gameManager;
        if (!gm || typeof gm.loadState !== 'function') throw new Error('sem loadState');
        const raw = rec.state;
        const bytes = raw instanceof Uint8Array ? raw : ArrayBuffer.isView(raw) ? new Uint8Array(raw.buffer, raw.byteOffset, raw.byteLength) : new Uint8Array(raw);
        rvUnfreezeCore(); await rvTick(120);
        await Promise.resolve(gm.loadState(bytes));
        await rvTick(60); rvUnfreezeCore();
        if (typeof showToast === 'function') showToast('Retomado de ' + rvFmtDate(rec.savedAt), 'play');
      } catch (e) { if (typeof showToast === 'function') showToast('Não consegui retomar — use o save do menu', 'warning'); }
      barra.remove();
    });
    no.addEventListener('click', async () => {
      try { await rvSaveDel(autoKey()); } catch (e) { }
      barra.remove();
    });
  }
  /* Assim que o jogo começar, pergunta (1× por abertura) se quer retomar. */
  (function pollResume() {
    const t0 = Date.now();
    const iv = setInterval(async () => {
      const em = window.EJS_emulator;
      if (resumePerguntado) { clearInterval(iv); return; }
      if (em && em.started) {
        clearInterval(iv); resumePerguntado = true;
        try {
          const rec = await rvSaveGet(autoKey());
          if (rec && rec.state && !em.paused) montarBarraResume(rec);
        } catch (e) { }
      } else if (Date.now() - t0 > 90000) clearInterval(iv);
    }, 700);
  })();

  /* ── 4. CLIPE DE GAMEPLAY (MediaRecorder sobre o canvas) ── */
  let clipeGravando = false, clipeRec = null, clipeChunks = [], clipeTimer = null;
  async function gravarClipe() {
    const lbl = $id('rv-sys-clip-lbl');
    if (clipeGravando) return;
    const canvas = document.querySelector('#game canvas');
    if (!canvas) { if (typeof showToast === 'function') showToast('Nenhum jogo ativo', 'warning'); return; }
    if (typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
      if (typeof showToast === 'function') showToast('Este navegador não grava clipes', 'warning'); return;
    }
    const mimes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
    const mime = mimes.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } });
    if (!mime) { if (typeof showToast === 'function') showToast('Formato de vídeo não suportado', 'warning'); return; }
    const durMs = (window.__rvClipLen || 10) * 1000;
    let stream;
    try { stream = canvas.captureStream(30); } catch (e) { if (typeof showToast === 'function') showToast('Não consegui capturar a tela', 'warning'); return; }
    clipeChunks = [];
    try { clipeRec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 }); }
    catch (e) { if (typeof showToast === 'function') showToast('Gravador indisponível', 'warning'); return; }
    clipeRec.ondataavailable = (e) => { if (e.data && e.data.size) clipeChunks.push(e.data); };
    clipeRec.onstop = () => {
      clipeGravando = false;
      if (lbl) lbl.textContent = 'Clipe';
      clearInterval(clipeTimer);
      const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
      const blob = new Blob(clipeChunks, { type: mime.split(';')[0] });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'retrovault-clipe_' + core + '_' + Date.now() + '.' + ext;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      try {
        let c = JSON.parse(RVStore.getItem('rv_clips') || '0');
        c = (typeof c === 'number' ? c : 0) + 1;
        RVStore.setItem('rv_clips', JSON.stringify(c));
      } catch (e) { }
      if (typeof showToast === 'function') showToast('Clipe salvo!', 'camera');
    };
    clipeRec.start(250);
    clipeGravando = true;
    let resta = Math.round(durMs / 1000);
    if (lbl) lbl.textContent = resta + 's…';
    clipeTimer = setInterval(() => {
      resta--;
      if (resta <= 0) { clearInterval(clipeTimer); try { clipeRec.stop(); } catch (e) { } }
      else if (lbl) lbl.textContent = resta + 's…';
    }, 1000);
    setTimeout(() => { if (clipeGravando) { try { clipeRec.stop(); } catch (e) { } } }, durMs + 400);
    if (typeof showToast === 'function') showToast('Gravando ' + (window.__rvClipLen || 10) + 's da tela…', 'camera');
  }

  /* ── 5. CARTUCHO (SRAM .srm) — exportar/importar ── */
  async function sramExportar() {
    const em = window.EJS_emulator, gm = em && em.gameManager;
    if (!gm || typeof gm.getSaveFile !== 'function') { if (typeof showToast === 'function') showToast('Núcleo sem suporte a cartucho', 'warning'); return; }
    let dados = null;
    try { dados = gm.getSaveFile(true); } catch (e) { try { dados = gm.getSaveFile(false); } catch (e2) { } }
    if (!dados || !dados.length) { if (typeof showToast === 'function') showToast('Este jogo não tem memória de cartucho', 'warning'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([dados instanceof Uint8Array ? dados : new Uint8Array(dados)]));
    a.download = rvGameLabel() + '.srm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    if (typeof showToast === 'function') showToast('Cartucho exportado (.srm)', 'check');
  }
  async function sramImportar(file) {
    const em = window.EJS_emulator, gm = em && em.gameManager;
    if (!gm || !gm.FS || typeof gm.getSaveFilePath !== 'function') { if (typeof showToast === 'function') showToast('Núcleo sem suporte a cartucho', 'warning'); return; }
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      gm.FS.writeFile(gm.getSaveFilePath(), bytes);
      try { if (typeof gm.saveSaveFiles === 'function') gm.saveSaveFiles(); } catch (e) { }
      if (typeof gm.restart === 'function') { gm.restart(); if (typeof showToast === 'function') showToast('Cartucho importado — jogo reiniciado', 'check'); }
      else if (typeof showToast === 'function') showToast('Cartucho gravado — reinicie o jogo para valer', 'check');
    } catch (e) { if (typeof showToast === 'function') showToast('Falha ao importar o cartucho', 'warning'); }
  }

  /* ── 6. ROM NO OFFLINE (cache retrovault-roms-v1 + sw.js) ── */
  const CACHE_ROMS = 'retrovault-roms-v1';
  const LS_OFFLINE = 'rv_offline_roms';
  const offlineLista = () => { try { return JSON.parse(localStorage.getItem(LS_OFFLINE) || '[]'); } catch (e) { return []; } };
  const estaOffline = () => offlineLista().indexOf(gkey) >= 0;
  function romCandidates() {
    const parts = gkey.split('/');
    const sys = parts.shift() || '';
    const fname = parts.join('/');
    const aliases = ({ gamegear: ['gamegear', 'GameGear', 'GAMEGEAR', 'gg', 'GG', 'segaGG'], segaGG: ['segaGG', 'gamegear', 'GameGear', 'gg', 'GG'] })[sys] || [sys];
    const urls = [];
    aliases.forEach(a => {
      const segs = fname.split('/');
      urls.push(ROMS_BASE + a + '/' + segs.map(s => encodeURIComponent(s)).join('/'));
      urls.push(ROMS_BASE + a + '/' + segs.map(s => encodeURIComponent(encodeURIComponent(s))).join('/'));
    });
    urls.push(ROMS_BASE + gkey.split('/').map(s => encodeURIComponent(s)).join('/'));
    return Array.from(new Set(urls.filter(u => u.indexOf('undefined') !== 0)));
  }
  function pintaOffline() {
    const btn = $id('rv-sys-offline'), lbl = $id('rv-sys-offline-lbl');
    if (!btn) return;
    const on = estaOffline();
    btn.classList.toggle('on', on);
    if (lbl) lbl.textContent = on ? 'No offline' : 'Offline';
    btn.title = on ? 'Este jogo está salvo para jogar sem internet (toque para remover)' : 'Baixa a ROM deste jogo para poder jogar sem internet';
  }
  async function alternarOffline() {
    if (estaOffline()) {
      try {
        const cache = await caches.open(CACHE_ROMS);
        await Promise.all(romCandidates().map(u => cache.delete(u).catch(() => { })));
        localStorage.setItem(LS_OFFLINE, JSON.stringify(offlineLista().filter(x => x !== gkey)));
      } catch (e) { }
      pintaOffline();
      if (typeof showToast === 'function') showToast('Jogo removido do offline', 'cloud');
      return;
    }
    if (typeof showToast === 'function') showToast('Baixando a ROM para o offline…', 'cloud');
    let ok = false;
    for (const u of romCandidates()) {
      try {
        const r = await fetch(u, { cache: 'no-store' });
        if (r && r.ok) { const cache = await caches.open(CACHE_ROMS); await cache.put(u, r); ok = true; break; }
      } catch (e) { }
    }
    if (ok) {
      localStorage.setItem(LS_OFFLINE, JSON.stringify(offlineLista().concat([gkey])));
      pintaOffline();
      if (typeof showToast === 'function') showToast('ROM no aparelho — dá para jogar sem internet', 'check');
    } else if (typeof showToast === 'function') showToast('Não consegui baixar a ROM agora', 'warning');
  }

  /* ── 7. Botões novos da barra de sistema (ouvinte próprio, sem tocar
         no manipulador existente) ── */
  document.getElementById('rv-sys-bar').addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-sys]');
    if (!btn) return;
    const act = btn.dataset.sys;
    if (act === 'clip') gravarClipe();
    else if (act === 'offline') alternarOffline();
    else if (act === 'sram-export') sramExportar();
    else if (act === 'sram-import') $id('rv-sram-file').click();
  });
  const sramInput = $id('rv-sram-file');
  if (sramInput) sramInput.addEventListener('change', () => {
    if (sramInput.files && sramInput.files[0]) sramImportar(sramInput.files[0]);
    sramInput.value = '';
  });
  pintaOffline();

  /* ── 8. Pílula de atualização (SW novo assumiu) ── */
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    let avisou = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (avisou || !sessionStorage.getItem('__rvPaginaRodando')) return;
      avisou = true;
      if (typeof showToast === 'function') showToast('Site atualizado — a próxima abertura usa a nova versão', 'sparkle');
    });
  }
  sessionStorage.setItem('__rvPaginaRodando', '1');
})();

/* ═══ Preferências do jogador (página Configurações → config.html) ═══
   A config.html concentra as configurações do emulador; o que estiver
   salvo no localStorage define os valores INICIAIS aqui. Sem
   preferências salvas, valem exatamente os padrões cravados acima. */
try {
  const rvCfg = JSON.parse(localStorage.getItem('rv_emu_settings_v1') || '{}');
  if (rvCfg.lang === 'pt-BR' || rvCfg.lang === 'en-US') EJS_language = rvCfg.lang;
  if (typeof rvCfg.volume === 'number') EJS_volume = Math.min(1, Math.max(0, rvCfg.volume));
  if (typeof rvCfg.startOnLoaded === 'boolean') EJS_startOnLoaded = rvCfg.startOnLoaded;
  if (typeof rvCfg.fullscreenOnLoad === 'boolean') EJS_fullscreenOnLoaded = rvCfg.fullscreenOnLoad;
  if (typeof rvCfg.startButtonName === 'string' && rvCfg.startButtonName.trim())
    EJS_startButtonName = rvCfg.startButtonName.trim();
  if (typeof rvCfg.forceLegacyCores === 'boolean') EJS_forceLegacyCores = rvCfg.forceLegacyCores;
  if (typeof rvCfg.videoRotation === 'number' && rvCfg.videoRotation >= 0 && rvCfg.videoRotation <= 3)
    EJS_videoRotation = rvCfg.videoRotation;
  if (typeof rvCfg.rewind === 'boolean') {
    if (rvCfg.rewind && RV_REWIND_OK) EJS_defaultOptions.rewindEnabled = 'enabled';
    else delete EJS_defaultOptions.rewindEnabled;
  }
  if (rvCfg.rewind && RV_REWIND_OK && [1, 3, 6, 12, 25, 50, 100].includes(rvCfg.rewindGranularity))
    EJS_defaultOptions['rewind-granularity'] = String(rvCfg.rewindGranularity);
  if (rvCfg.saveLocation === 'browser' || rvCfg.saveLocation === 'download')
    EJS_defaultOptions['save-state-location'] = rvCfg.saveLocation;
  if (typeof rvCfg.saveSlot === 'number' && rvCfg.saveSlot >= 1 && rvCfg.saveSlot <= 9)
    EJS_defaultOptions['save-state-slot'] = String(rvCfg.saveSlot);
  if (typeof rvCfg.shader === 'string' && rvCfg.shader)
    EJS_defaultOptions.shader = rvCfg.shader;
  if (rvCfg.vsync === true || rvCfg.vsync === false)
    EJS_defaultOptions.vsync = rvCfg.vsync ? 'enabled' : 'disabled';
  /* ── Extras (moldura, clipe, tempo, portão dos pais) ── */
  if (typeof rvCfg.bezel === 'string' && ['auto', 'slim', 'crt'].indexOf(rvCfg.bezel) >= 0) {
    document.body.classList.add('rv-bezel-' + rvCfg.bezel);
    if (rvCfg.bezel === 'auto' && typeof CONSOLE_THEMES === 'object' && CONSOLE_THEMES[core]) {
      document.body.style.setProperty('--rv-bezel-c', CONSOLE_THEMES[core].color);
      document.body.style.setProperty('--rv-bezel-glow', CONSOLE_THEMES[core].glow);
    }
  }
  window.__rvClipLen = ([10, 15, 30].indexOf(rvCfg.clipLen) >= 0) ? rvCfg.clipLen : 10;
  window.__rvTrackCfg.on = (rvCfg.trackTime !== false);
  /* Portão dos pais: console fora da lista liberada exige o PIN.
     Enquanto o portão estiver de pé, o jogo não inicia sozinho. */
  if (typeof window.__rvParentalGate === 'function') {
    if (window.__rvParentalGate(rvCfg)) EJS_startOnLoaded = false;
  }
} catch (e) { /* preferências indisponíveis: mantém os padrões */ }

const isArcade = game.endsWith('.zip');

// Guarda de execução única: o callback EJS_onGameStart e o setTimeout de
// segurança (14s) podem AMBOS disparar. Antes, tudo rodava em dobro —
// rv_sessions contava 2 por jogo, o jingle de boot tocava de novo ~14s
// depois do início e initControls/trackAchievements eram reexecutados.
let __rvGameReadyFired = false;
function onGameReady() {
  if (__rvGameReadyFired) return;
  __rvGameReadyFired = true;
  clearTimeout(window.__rvBootWatchdog); // boot OK: desarma o watchdog
  const ld = document.getElementById('rv-loading');
  if (ld) ld.classList.add('hidden');
  document.getElementById('rv-fs-btn').classList.add('visible');
  document.getElementById('rv-float-btns').classList.add('visible');
  const qmEl = document.getElementById('rv-qm');
  if (qmEl) qmEl.classList.add('visible');

  // Mini-menu de opções: o ⋮ abre/fecha; clique fora ou numa ação fecha.
  if (qmEl) {
    const qmToggleEl = document.getElementById('rv-qm-toggle');
    const fecharQm = () => { qmEl.classList.remove('open'); qmToggleEl.setAttribute('aria-expanded', 'false'); };
    qmToggleEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const aberto = qmEl.classList.toggle('open');
      qmToggleEl.setAttribute('aria-expanded', String(aberto));
    });
    document.addEventListener('click', (e) => {
      if (qmEl.classList.contains('open') && !qmEl.contains(e.target)) fecharQm();
    });
    qmEl.querySelectorAll('.rv-float-btn, #rv-fs-btn').forEach(b =>
      b.addEventListener('click', () => setTimeout(fecharQm, 200)));
  }

  // Redireciona também o menu hambúrguer do modo touch.
  bindEmulatorMenuToCheats();
  setTimeout(bindEmulatorMenuToCheats, 250);

  // Ativa a região touch/stylus da tela inferior do Nintendo DS.
  initNDSStylus();
  initControls();

  // Puxa o save da conta em segundo plano: trocou de PC/celular e o save
  // já fica disponível no botão "Carregar" sem precisar de nada manual.
  if (rvCloudOn() && (RVAccount.config.sync || {}).autoDownloadSaves !== false) {
    (async () => {
      try {
        const key = rvSaveKey();
        const local = await rvSaveGet(key);
        const cloud = await RVAccount.downloadSave(key);
        if (!cloud || !cloud.state) return;
        const localAt = local && local.savedAt ? Date.parse(local.savedAt) : 0;
        const cloudAt = cloud.savedAt ? Date.parse(cloud.savedAt) : 0;
        if (cloudAt > localAt) {
          await rvSavePut(key, cloud);
          refreshRvSaveInfo();
          showToast('Save da sua conta disponível (' + rvFmtDate(cloud.savedAt) + ')', 'cloud');
        }
      } catch (e) { /* offline ou sem save na nuvem: segue o jogo */ }
    })();
  }

  // Tocar som de boot do console
  RV_AUDIO.playBoot(core);

  // Tracking para conquistas
  try {
    const gameName = decodeURIComponent(game || '').split('/').pop().replace(/\.[^/.]+$/, '');
    const consoleKey = (game || '').split('/')[0];
    trackAchievements(consoleKey, gameName);
  } catch(e) {}
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => initControls(), 150);
});

/* ═══ CARREGAMENTO DA BASE DE CHEATS ═══
   A versão do EmulatorJS usada pelo loader não encaminha EJS_cheatPath
   automaticamente. Por isso carregamos o JSON e entregamos os códigos em
   EJS_cheats antes de iniciar o loader.
═══════════════════════════════════════════════════════════ */
function normalizeCheatName(value) {
  return decodeURIComponent(String(value || ''))
    .replace(/\.[^/.]+$/, '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[_]+/g, ' ')
    .replace(/[.!]+$/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function cheatNameForms(value) {
  const full = normalizeCheatName(value);
  const edition = full
    .replace(/\s*\([^)]*\)/g, '')
    .replace(/\s*\[[^\]]*\]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return { full, edition };
}

function findCheatEntries(database, romName) {
  if (!database || typeof database !== 'object') return [];

  const target = cheatNameForms(romName);
  const matches = [];
  for (const [title, entries] of Object.entries(database)) {
    if (!Array.isArray(entries)) continue;
    const key = cheatNameForms(title);
    let score = 0;
    if (key.full === target.full) score = 100;
    else if (key.edition === target.edition) score = 90;
    else if (target.full.startsWith(key.full + ' (') || target.full.startsWith(key.full + ' -')) score = 70;
    if (score > 0) matches.push({ score, entries });
  }

  // Permite aliases sem duplicar cheats quando há mais de uma chave para a ROM.
  matches.sort((a, b) => b.score - a.score);
  const result = [];
  const seen = new Set();
  for (const match of matches) {
    for (const item of match.entries) {
      if (!item || typeof item.desc !== 'string' || typeof item.code !== 'string') continue;
      if (!item.desc.trim() || !item.code.trim()) continue;
      const id = `${item.desc.trim()}\u0000${item.code.trim()}`;
      if (seen.has(id)) continue;
      seen.add(id);
      result.push([item.desc.trim(), item.code.trim()]);
    }
  }
  return result;
}

async function loadRvCheats() {
  const base = String(window.EJS_cheatPath || 'cheats/')
    .replace(/\/+$/, '') + '/';
  const cheatCore = isNDSCore ? 'nds' : core;
  const paths = [
    `${base}cheats.json`,
    `${base}${encodeURIComponent(cheatCore)}.json`
  ];

  const databases = [];
  for (const path of paths) {
    try {
      const url = new URL(path, document.baseURI).href;
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) continue;
      const data = await response.json();
      if (data && typeof data === 'object') databases.push(data);
    } catch (error) {
      console.warn('[RetroVault Web] Não foi possível carregar cheats:', path, error);
    }
  }

  const database = Object.assign({}, ...databases);
  const romName = window.EJS_gameName || decodeURIComponent((game || '').split('/').pop() || '');
  window.EJS_cheats = findCheatEntries(database, romName);
  console.info(`[RetroVault Web] Cheats carregados para "${romName}": ${window.EJS_cheats.length}`);
}

let __rvLoaderStarted = false;
async function startRvEmulator() {
  if (__rvLoaderStarted) return;
  __rvLoaderStarted = true;

  try {
    await loadRvCheats();
  } catch (error) {
    window.EJS_cheats = [];
    console.warn('[RetroVault Web] Falha ao preparar cheats:', error);
  }

  const script = document.createElement('script');
  script.src = RV_EJS_LOCAL + 'loader.js';
  script.onerror = () => {  /* sem vendor baixado ainda → CDN */
    if (window.__rvEjsFallback) return; window.__rvEjsFallback = true;
    EJS_pathtodata = RV_EJS_CDN;
    const s2 = document.createElement('script');
    s2.src = RV_EJS_CDN + 'loader.js';
    document.body.appendChild(s2);
  };
  document.body.appendChild(script);

  /* Watchdog de boot: se o núcleo não levantar em 30s, mostra o erro na
     tela em vez de deixar tela preta + controles "vivos" sem jogo. */
  window.__rvBootWatchdog = setTimeout(() => {
    try {
      if (window.EJS_emulator && window.EJS_emulator.started) return;
      const msg = document.getElementById('rv-msg');
      if (msg) {
        const detalhe = window.__rvLastError ? ' [' + String(window.__rvLastError).slice(0, 90) + ']' : '';
        msg.textContent = 'O núcleo não iniciou neste navegador.' + detalhe + ' Recarregue; se persistir, atualize o navegador.';
        msg.style.color = '#ff7777';
        msg.style.whiteSpace = 'normal';
        msg.style.maxWidth = '320px';
      }
      console.warn('[RetroVault Web] watchdog: emulador não iniciou em 30s.', window.__rvLastError || '');
    } catch (e) { }
  }, 30000);
}

if (isArcade) {
  // O fluxo padrão do EmulatorJS extrai o neogeo.zip em arquivos soltos na raiz
  // do FS virtual — e o FBNeo só reconhece o romset se encontrar o ARQUIVO
  // neogeo.zip ao lado da ROM. Interceptamos a criação do emulador (mesmo
  // padrão de patch em runtime já usado no menu de cheats) e regravamos a BIOS
  // como arquivo único. Instalado só para arcade; demais consoles intactos.
  if (!window.__rvBiosTrapInstalled) {
    window.__rvBiosTrapInstalled = true;
    let __rvEjsInstance = null;
    Object.defineProperty(window, 'EJS_emulator', {
      configurable: true,
      get() { return __rvEjsInstance; },
      set(inst) {
        if (inst && !inst.__rvBiosPatched && typeof inst.downloadBios === 'function') {
          inst.__rvBiosPatched = true;
          inst.downloadBios = async function () {
            const url = this.config && this.config.biosUrl;
            if (!url) return;
            try {
              const resp = await fetch(url);
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              const nome = url.split('/').pop().split('?')[0] || 'neogeo.zip';
              this.gameManager.FS.writeFile(nome, new Uint8Array(await resp.arrayBuffer()));
              this.config.biosUrl = url;
            } catch (err) {
              console.error('[RetroVault Web] Falha ao baixar BIOS:', url, err);
              if (this.startGameError) this.startGameError(this.localization ? this.localization('Network Error') : 'Network Error');
              return; // deixa o próprio FBNeo exibir a tela de romset ausente
            }
          };
        }
        __rvEjsInstance = inst;
      }
    });
  }
  preloadGame(game).then(blobUrl => {
    EJS_gameUrl = blobUrl;
    // A BIOS do NeoGeo precisa vir da mesma fonte que serviu a ROM.
    // Antes: sempre 'roms/arcade/neogeo.zip' → 404 no GitHub Pages →
    // o EmulatorJS logava "Network Error" e o jogo nunca iniciava.
    EJS_biosUrl = (window.__rvRomFromRemote ? ROMS_BASE : 'roms/') + 'arcade/neogeo.zip';
    EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
    startRvEmulator();
  }).catch(() => {
    EJS_gameUrl = ROMS_BASE + game;
    EJS_biosUrl = ROMS_BASE + 'arcade/neogeo.zip';
    EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
    startRvEmulator();
  });
} else {
  // genesis_plus_gx exige a BIOS do Sega CD (bios_CD_U.bin) junto ao conteúdo.
  // Sonda as fontes (mesma ordem local→remoto das ROMs) e só define EJS_biosUrl
  // se o arquivo existir — sem a BIOS o comportamento anterior é mantido.
  const SCD_BIOS_PATH = 'segacd/bios_CD_U.bin';
  const configureSegaCDBios = async () => {
    if (core !== 'segaCD') return;
    const urls = ['roms/' + SCD_BIOS_PATH, ROMS_BASE + SCD_BIOS_PATH];
    for (const url of urls) {
      try {
        const head = await fetch(url, { method: 'HEAD' });
        if (head.ok) { EJS_biosUrl = url; console.log('[RetroVault Web] BIOS do Sega CD configurada:', url); return; }
      } catch (error) {}
    }
    console.warn('[RetroVault Web] BIOS do Sega CD não encontrada (' + SCD_BIOS_PATH + '). O jogo pode não iniciar.');
  };
  preloadGame(game).then(async blobUrl => {
    EJS_gameUrl = blobUrl; EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
    await configureSegaCDBios();
    startRvEmulator();
  }).catch(() => {
    document.getElementById('rv-msg').textContent = 'ROM indisponível no servidor — o arquivo não foi encontrado. Volte e escolha outro jogo; os demais devem funcionar.';
    document.getElementById('rv-msg').style.color = '#ff7777';
    initControls(); // Mostra overlay mesmo em erro/teste sem ROM
  });
}

/* Hide native gamepad */
(function(){
  const st = document.createElement('style');
  st.textContent = `.ejs_virtualGamepad,.ejs-virtualGamepad,[class*="virtualGamepad"],[class*="gamepad_container"],[class*="touch_controls"],[class*="ejs_gamepad"],[class*="ejs-gamepad"],[id*="virtualGamepad"],.ejs_gamepad_button,.ejs_gamepad_dpad,[class*="b_left"],[class*="b_right"],[class*="b_fast"],[class*="b_slow"],[class*="b_menu"],[class*="nipple"],[class*="joystick"],[class*="stick"],.back,.front{display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;}`;
  document.head.appendChild(st);
  // Observador sempre ativo: em notebooks com tela sensível ao toque o
  // EmulatorJS ainda tenta injetar o gamepad dele. Aqui ele nunca aparece.
  {
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
      if (!(n instanceof HTMLElement)) return;
      if (/gamepad|virtualGamepad|nipple|joystick|b_left|b_right|b_fast|b_slow|b_menu|touch_control/i.test((n.className||'')+(n.id||''))
          && !n.classList.contains('rv-zone') && !n.classList.contains('rv-zone-dpad'))
        n.style.cssText='display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;';
    }))).observe(document.body, {childList:true, subtree:true});
  }
}());

/* Register Service Worker (PWA) — sw.js na raiz; só intercepta GET same-origin
   (ROMs/CDN passam direto), então não interfere no boot do emulador. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
}

function sendInput(id, val) {
  try {
    const manager = window.EJS_emulator?.gameManager;
    if (!manager) return;
    if (typeof manager.simulateInput === 'function') {
      manager.simulateInput(0, id, val);
    } else if (typeof manager.functions?.simulateInput === 'function') {
      manager.functions.simulateInput(0, id, val);
    }
    if (new URLSearchParams(window.location.search).has('debug')) {
      console.log('[RetroVault Web] input', { id, val });
    }
  } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════
   CONTROLE VIRTUAL: LIGA/DESLIGA
   Remove por completo o overlay/pad da tela (imagens, zonas de toque
   e o engine do RetroArch), liberando a viewport para o jogo.
═══════════════════════════════════════════════════════════ */
function teardownControls() {
  if (window.__rvRAEngine && window.__rvRAEngine.destroy) {
    try { window.__rvRAEngine.destroy(); } catch (e) { }
  }
  window.__rvRAEngine = null;
  ['rv-overlay', 'rv-pad'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('active');
    el.innerHTML = '';
    el.removeAttribute('style');
  });
}

/* Reage a controle conectado/desconectado enquanto o jogo roda. */
/* RetroVault OS: console de controles FÍSICOS — o pad virtual nunca entra,
   em nenhum aparelho (touch, emulação de dispositivo, landscape...). */
var RV_OS_PHYSICAL_CONTROLS = true;
if (window.RVInput) {
  RVInput.onChange(info => {
    if (RV_OS_PHYSICAL_CONTROLS) {
      teardownControls();
      document.body.classList.add('rv-no-virtualpad');
      return;
    }
    if (info.previous === null) return;           // primeira avaliação: initControls já cuida
    if (!info.show) {
      teardownControls();
      document.body.classList.add('rv-no-virtualpad');
      if (typeof showToast === 'function') {
        showToast(info.reason === 'controle físico conectado'
          ? 'Controle detectado — controles da tela ocultados'
          : 'Controles da tela ocultados', 'gamepad');
      }
    } else {
      document.body.classList.remove('rv-no-virtualpad');
      initControls(true);
      if (typeof showToast === 'function' && info.reason !== 'aparelho de toque sem controle') {
        showToast('Controles da tela ativados', 'gamepad');
      } else if (typeof showToast === 'function') {
        showToast('Controle desconectado — controles da tela de volta', 'gamepad');
      }
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   INIT CONTROLS
   Portrait + overlay disponível → sistema de imagem calibrado
   Landscape ou sem overlay → controles CSS
═══════════════════════════════════════════════════════════ */
let __rvInitPromise = null;   // single-flight: impede execuções concorrentes do initControls
async function initControls(force = false) {
  // Se já há uma inicialização em andamento, reutiliza-a (evita múltiplos engines)
  if (__rvInitPromise) { return __rvInitPromise; }

  __rvInitPromise = (async () => {
    // ─── DECISÃO: este aparelho precisa de controle na tela? ───
    // PC com mouse/teclado ou QUALQUER aparelho com gamepad conectado
    // não recebe overlay nenhum: a tela fica limpa e o jogo usa o
    // controle físico (o EmulatorJS já trata gamepad nativamente).
    // RetroVault OS: RV_OS_PHYSICAL_CONTROLS força esse caminho SEMPRE.
    if (RV_OS_PHYSICAL_CONTROLS || (window.RVInput && !RVInput.shouldShowVirtualPad())) {
      teardownControls();
      document.body.classList.add('rv-no-virtualpad');
      return;
    }
    document.body.classList.remove('rv-no-virtualpad');

    // Aguarda o EJS_emulator estar pronto (se ainda não estiver) para que o
    // envio de input funcione. Timeout de 8s para não travar a tela.
    const t0 = Date.now();
    while ((!window.EJS_emulator || !window.EJS_emulator.gameManager) && Date.now() - t0 < 8000) {
      await new Promise(r => setTimeout(r, 150));
    }

    // Garante que o botão/menu touch também abra Cheats depois que o EJS estiver pronto.
    bindEmulatorMenuToCheats();
    initNDSStylus();

    // Destrói qualquer engine antigo de forma segura
    if (window.__rvRAEngine && window.__rvRAEngine.destroy) {
      try { window.__rvRAEngine.destroy(); } catch(e){}
      window.__rvRAEngine = null;
    }

    const W = window.innerWidth, H = window.innerHeight;
    const isPortrait = H > W;

    const overlayWrap = document.getElementById('rv-overlay');
    const padWrap = document.getElementById('rv-pad');

    overlayWrap.classList.remove('active');
    overlayWrap.innerHTML = '';
    padWrap.classList.remove('active');
    padWrap.innerHTML = '';

    const DEBUG = new URLSearchParams(window.location.search).has('debug') || window.location.search.toLowerCase().includes('debug');

    // 1º Tenta carregar arquivo .cfg automático do RetroArch (ex: overlays/n64/n64.cfg)
    if (typeof window.loadRetroArchOverlay === 'function') {
      const raEngine = await window.loadRetroArchOverlay(core, overlayWrap, { debug: DEBUG, isPortrait });
      if (raEngine) {
        window.__rvRAEngine = raEngine;
        overlayWrap.classList.add('active');
        return;
      }
    }

    const overlay = OVERLAYS[core];
    if (isPortrait && overlay && overlay.base) {
      buildOverlay(overlay);
    } else {
      buildPad(SKINS[core] || SKINS['snes']);
    }
  })();

  // Libera o "single-flight" após terminar (para permitir re-init em resize/orientação)
  try { await __rvInitPromise; } finally { __rvInitPromise = null; }
}

/* ═══════════════════════════════════════════════════════════
   BUILD OVERLAY (sistema calibrado com zonas de toque)
═══════════════════════════════════════════════════════════ */
function buildOverlay(cfg) {
  const wrap = document.getElementById('rv-overlay');
  wrap.innerHTML = '';

  const W = window.innerWidth;
  const H = window.innerHeight;
  const containerH = Math.round(W * cfg.aspect);
  
  // Modo debug: adiciona ?debug=1 na URL para ver as zonas
  const DEBUG = new URLSearchParams(window.location.search).has('debug') || window.location.search.toLowerCase().includes('debug');

  // Seta o tamanho do container (limita à altura da tela)
  const actualH = Math.min(containerH, H);
  Object.assign(wrap.style, {
    width: W + 'px',
    height: actualH + 'px',
  });

  // Imagem base
  const baseImg = document.createElement('img');
  baseImg.className = 'rv-skin-img';
  baseImg.src = cfg.base;
  baseImg.draggable = false;
  Object.assign(baseImg.style, {
    width: W + 'px',
    height: containerH + 'px',
    position: 'absolute',
    bottom: '0',
    left: '0',
  });
  wrap.appendChild(baseImg);

  // Imagem animada
  let animImg = null;
  if (cfg.animated) {
    animImg = document.createElement('img');
    animImg.className = 'rv-anim-img';
    animImg.src = cfg.animated;
    animImg.draggable = false;
    Object.assign(animImg.style, {
      width: W + 'px',
      height: containerH + 'px',
      position: 'absolute',
      bottom: '0',
      left: '0',
    });
    wrap.appendChild(animImg);
  }

  // Pré-carrega animações de botões
  if (cfg.animButtons) {
    for (const src of Object.values(cfg.animButtons)) { const i = new Image(); i.src = src; }
  }

  function showAnim(src) {
    if (!animImg) return;
    if (src) { animImg.src = src; animImg.classList.add('show'); }
    else { animImg.classList.remove('show'); }
  }

  // Helper: calcula posição em px a partir de % da imagem
  // As coordenadas são % da imagem inteira (que pode ser maior que o container visível)
  // Precisamos converter para posição dentro do container
  const offsetY = containerH - actualH; // Quanto da imagem está cortada no topo
  const px = (pct, dim) => {
    if (dim === 'x') return (pct / 100) * W;
    // Para Y: converte % da imagem para px dentro do container
    return (pct / 100) * containerH - offsetY;
  };

  if (DEBUG) {
    console.log('Overlay debug:', { W, H, containerH, actualH, offsetY });
  }

  // Cria zonas de toque
  for (const [name, zone] of Object.entries(cfg.zones)) {
    if (zone.type === 'dpad') {
      const el = document.createElement('div');
      el.className = 'rv-zone rv-zone-dpad';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
      });
      
      if (DEBUG) {
        el.style.border = '2px solid lime';
        el.style.background = 'rgba(0,255,0,0.2)';
        el.textContent = 'DPAD';
        el.style.color = 'lime';
        el.style.fontSize = '10px';
        el.style.fontWeight = 'bold';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
      }

      const st = {up:0,down:0,left:0,right:0};
      const ID = {up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
      function upd(ns) { for (const d in st) if (ns[d]!==st[d]) { sendInput(ID[d],ns[d]); st[d]=ns[d]; }
        if (cfg.animButtons) { let s=null; if(ns.up)s=cfg.animButtons.UP; else if(ns.down)s=cfg.animButtons.DOWN; else if(ns.left)s=cfg.animButtons.LEFT; else if(ns.right)s=cfg.animButtons.RIGHT; showAnim(s); }
      }
      function getDir(px2,py2) {
        const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
        const dx=px2-cx, dy=py2-cy, a=Math.atan2(dy,dx), d=Math.sqrt(dx*dx+dy*dy);
        if (d < r.width*0.08) return {up:0,down:0,left:0,right:0};
        if (a>-Math.PI/4&&a<=Math.PI/4) return {up:0,down:0,left:0,right:1};
        if (a>Math.PI/4&&a<=3*Math.PI/4) return {up:0,down:1,left:0,right:0};
        if (a>-3*Math.PI/4&&a<=-Math.PI/4) return {up:1,down:0,left:0,right:0};
        return {up:0,down:0,left:1,right:0};
      }
      const clr = () => upd({up:0,down:0,left:0,right:0});
      el.addEventListener('touchstart', e=>{e.preventDefault();e.stopPropagation();upd(getDir(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
      el.addEventListener('touchmove', e=>{e.preventDefault();e.stopPropagation();upd(getDir(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
      el.addEventListener('touchend', e=>{e.preventDefault();e.stopPropagation();clr();},{passive:false});
      el.addEventListener('touchcancel', e=>{e.preventDefault();e.stopPropagation();clr();},{passive:false});
      wrap.appendChild(el);

    } else if (zone.type === 'analog') {
      // Zona de analógico (placeholder — mostra imagem do stick se disponível)
      const el = document.createElement('div');
      el.className = 'rv-zone';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
        borderRadius: '50%',
      });

      // Analog stick logic
      const R2 = zw / 2;
      const MAX = R2 * 0.6;
      const THRESH = 0.40, AV = 0x7fff;
      const sent = {up:0,down:0,left:0,right:0};
      const DM = {up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
      function sDir(d,v){if(sent[d]===v)return;sent[d]=v;sendInput(DM[d],v);}
      function sAn(nx,ny){
        sendInput(EJS_INPUT.LSTICK_RIGHT,nx>0?Math.round(nx*AV):0);
        sendInput(EJS_INPUT.LSTICK_LEFT,nx<0?Math.round(-nx*AV):0);
        sendInput(EJS_INPUT.LSTICK_DOWN,ny>0?Math.round(ny*AV):0);
        sendInput(EJS_INPUT.LSTICK_UP,ny<0?Math.round(-ny*AV):0);
      }
      function relAll(){sDir('up',0);sDir('down',0);sDir('left',0);sDir('right',0);sAn(0,0);}

      let active=false, ox=0, oy=0;
      function onS(e){e.preventDefault();e.stopPropagation();const t=e.touches?e.touches[0]:e;const r=el.getBoundingClientRect();active=true;ox=r.left+R2;oy=r.top+R2;mv(t.clientX-ox,t.clientY-oy);}
      function onM(e){if(!active)return;e.preventDefault();const t=e.touches?e.touches[0]:e;mv(t.clientX-ox,t.clientY-oy);}
      function onE(e){e.preventDefault();e.stopPropagation();active=false;relAll();}
      function mv(dx,dy){
        const dist=Math.sqrt(dx*dx+dy*dy),cl=Math.min(dist,MAX),ang=Math.atan2(dy,dx);
        const cx2=Math.cos(ang)*cl,cy2=Math.sin(ang)*cl;
        const nx=cx2/MAX,ny=cy2/MAX;
        sAn(nx,ny);
        sDir('right',nx>THRESH?1:0);sDir('left',nx<-THRESH?1:0);
        sDir('down',ny>THRESH?1:0);sDir('up',ny<-THRESH?1:0);
      }
      el.addEventListener('touchstart',onS,{passive:false});
      el.addEventListener('touchmove',onM,{passive:false});
      el.addEventListener('touchend',onE,{passive:false});
      el.addEventListener('touchcancel',onE,{passive:false});
      wrap.appendChild(el);

    } else if (zone.type === 'btn') {
      const el = document.createElement('div');
      el.className = 'rv-zone';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
        borderRadius: '30%',
      });

      if (DEBUG) {
        el.style.border = '2px solid red';
        el.style.background = 'rgba(255,0,0,0.2)';
        el.textContent = name;
        el.style.color = 'red';
        el.style.fontSize = '9px';
        el.style.fontWeight = 'bold';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
      }

      const inputId = zone.input;
      const btnName = name;

      function press() {
        el.classList.add('pressed');
        sendInput(inputId, 1);
        if (cfg.animButtons?.[btnName]) showAnim(cfg.animButtons[btnName]);
      }
      function release() {
        el.classList.remove('pressed');
        sendInput(inputId, 0);
        showAnim(null);
      }

      el.addEventListener('touchstart', e=>{e.preventDefault();e.stopPropagation();press();},{passive:false});
      el.addEventListener('touchend', e=>{e.preventDefault();e.stopPropagation();release();},{passive:false});
      el.addEventListener('touchcancel', e=>{e.preventDefault();e.stopPropagation();release();},{passive:false});
      el.addEventListener('mousedown', e=>{e.preventDefault();e.stopPropagation();press();});
      el.addEventListener('mouseup', e=>{e.preventDefault();e.stopPropagation();release();});
      wrap.appendChild(el);
    }
  }

  wrap.classList.add('active');
}

/* ═══════════════════════════════════════════════════════════
   BUILD PAD (CSS fallback para landscape)
═══════════════════════════════════════════════════════════ */
function buildPad(skin) {
  const pad = document.getElementById('rv-pad');
  pad.innerHTML = '';
  const W = window.innerWidth, H = window.innerHeight, LS = W > H;
  const isNDSLayout = isNDSCore;
  // No fallback do DS, a barra é transparente para não esconder a tela touch.
  const BAR_H = LS ? H : (isNDSLayout ? Math.round(Math.min(H * 0.20, 170)) : Math.round(Math.min(H*0.42,260)));
  const BAR_Y = H - BAR_H;
  const barBackground = isNDSLayout ? 'transparent' : skin.barBg;
  const COL_W = LS ? Math.round(Math.min(W*0.24,180)) : Math.round(W*0.50);
  const MAR=8, REF=LS?COL_W:BAR_H;
  const DS=Math.round(Math.min(REF*0.72,LS?COL_W-16:160));
  const BS=Math.round(Math.min(REF*0.28,LS?(COL_W-DS)*0.9:62));
  const GAP=Math.round(BS*0.10);
  const SW=Math.round(Math.min(COL_W*0.90,LS?COL_W-2*MAR:88));
  const SH=Math.round(Math.min(REF*0.14,34));
  const MW=Math.round(Math.min(LS?COL_W-2*MAR:W*0.14,72));
  const MH=Math.round(Math.min(REF*0.12,28));

  if(LS){[0,W-COL_W].forEach(x=>{const d=document.createElement('div');Object.assign(d.style,{position:'absolute',left:x+'px',top:'0',width:COL_W+'px',height:H+'px',background:barBackground,zIndex:'1',pointerEvents:'none'});pad.appendChild(d);});}
  else{const d=document.createElement('div');Object.assign(d.style,{position:'absolute',left:'0',top:BAR_Y+'px',width:W+'px',height:BAR_H+'px',background:barBackground,zIndex:'1',pointerEvents:'none'});pad.appendChild(d);}

  const diskCX=LS?Math.round(COL_W/2):Math.round(W*0.25);
  const diskCY=LS?Math.round(H*0.58):Math.round(BAR_Y+BAR_H*0.52);
  const faceCX=LS?Math.round(W-COL_W/2):Math.round(W*0.75);
  const faceCY=diskCY, shY=LS?MAR:BAR_Y+MAR;
  const metaCY=LS?Math.round(H/2-MH/2):Math.round(BAR_Y+BAR_H*0.12);
  const OFF=BS+GAP;
  const FPOS=[{dx:-OFF,dy:0},{dx:0,dy:-OFF},{dx:OFF,dy:0},{dx:0,dy:OFF}];

  function mkEl(c,s){const e=document.createElement('div');e.className=c;Object.assign(e.style,{position:'absolute',zIndex:'5'},s);return e;}
  function makeBtn(f,cx,cy,sz){sz=Math.max(sz,34);const e=mkEl('rv-btn',{width:sz+'px',height:sz+'px',left:(cx-sz/2)+'px',top:(cy-sz/2)+'px',fontSize:(f.fontSize||Math.round(sz*0.42))+'px',color:'#fff',background:f.color,border:`2.5px solid ${f.border}`,boxShadow:`0 0 18px ${f.glow||f.border+'99'}, 0 4px 14px rgba(0,0,0,.75)`,opacity:'.97'});e.textContent=f.label;bindBtn(e,f.input);return e;}
  function makeShoulder(sh,x,y){const lx=LS&&sh.side==='right'?W-MAR-SW:(LS?MAR:x);const e=mkEl('rv-shoulder',{width:SW+'px',height:SH+'px',left:(LS?lx:x)+'px',top:y+'px',fontSize:Math.round(SH*0.52)+'px',color:'#fff',background:sh.color,border:`1.5px solid ${sh.border}`,boxShadow:`0 0 12px ${sh.glow}`,opacity:'.95',borderRadius:sh.side==='right'?'10px 4px 4px 10px':'4px 10px 10px 4px'});e.textContent=sh.label;bindBtn(e,sh.input);return e;}
  function makeMeta(m,cx,cy,w,h){const e=mkEl('rv-meta',{width:w+'px',height:h+'px',left:(cx-w/2)+'px',top:(cy-h/2)+'px',fontSize:Math.round(h*0.5)+'px',color:m.textColor||'rgba(255,255,255,0.7)',background:m.color,border:`1px solid ${m.border}`,borderRadius:'20px',opacity:'.92'});e.textContent=m.label;bindBtn(e,m.input);return e;}
  function bindBtn(e,id){e.addEventListener('touchstart',ev=>{ev.preventDefault();e.classList.add('pressed');sendInput(id,1);},{passive:false});e.addEventListener('touchend',ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});e.addEventListener('touchcancel',ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});e.addEventListener('mousedown',()=>{e.classList.add('pressed');sendInput(id,1);});e.addEventListener('mouseup',()=>{e.classList.remove('pressed');sendInput(id,0);});}

  function makeDpad(color,border,cx,cy,size){
    const wrap=mkEl('',{width:size+'px',height:size+'px',left:(cx-size/2)+'px',top:(cy-size/2)+'px',touchAction:'none',pointerEvents:'auto',zIndex:'6',borderRadius:'50%',background:skin.diskBg,border:`2px solid ${skin.diskBorder||border+'44'}`,boxShadow:'0 4px 20px rgba(0,0,0,.5)'});wrap.id='rv-dpad';
    const inner=Math.round(size*0.75),offset=Math.round((size-inner)/2);
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 90 90');svg.setAttribute('width',inner);svg.setAttribute('height',inner);svg.style.cssText=`position:absolute;top:${offset}px;left:${offset}px;pointer-events:none;`;
    svg.innerHTML=`<g filter="drop-shadow(0 2px 8px rgba(0,0,0,.9))"><rect x="27" y="5" width="36" height="80" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/><rect x="5" y="27" width="80" height="36" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/><rect x="27" y="27" width="36" height="36" rx="5" fill="${color}"/><polygon points="45,11 54,26 36,26" fill="${border}" opacity=".95"/><polygon points="45,79 54,64 36,64" fill="${border}" opacity=".95"/><polygon points="11,45 26,54 26,36" fill="${border}" opacity=".95"/><polygon points="79,45 64,54 64,36" fill="${border}" opacity=".95"/></g>`;
    wrap.appendChild(svg);
    const DIRS=[{up:1,left:1},{up:1},{up:1,right:1},{left:1},{},{right:1},{down:1,left:1},{down:1},{down:1,right:1}];
    const st={up:0,down:0,left:0,right:0};const ID={up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
    function upd(ns){for(const d in st)if(ns[d]!==st[d]){sendInput(ID[d],ns[d]);st[d]=ns[d];}}
    function fp(px2,py2){const r=wrap.getBoundingClientRect(),s3=r.width/3;const i=Math.max(0,Math.min(8,Math.floor((py2-r.top)/s3)*3+Math.floor((px2-r.left)/s3)));const d=DIRS[i];return{up:d.up?1:0,down:d.down?1:0,left:d.left?1:0,right:d.right?1:0};}
    const clr=()=>upd({up:0,down:0,left:0,right:0});
    wrap.addEventListener('touchstart',e=>{e.preventDefault();upd(fp(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
    wrap.addEventListener('touchmove',e=>{e.preventDefault();upd(fp(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
    wrap.addEventListener('touchend',e=>{e.preventDefault();clr();},{passive:false});
    wrap.addEventListener('touchcancel',e=>{e.preventDefault();clr();},{passive:false});
    return wrap;
  }

  function makeAnalog(color,border,cx,cy,size){
    const wrap=mkEl('',{width:size+'px',height:size+'px',left:(cx-size/2)+'px',top:(cy-size/2)+'px',touchAction:'none',pointerEvents:'auto',zIndex:'6',borderRadius:'50%',background:skin.diskBg,border:`2px solid ${skin.diskBorder||border+'44'}`,boxShadow:'0 4px 20px rgba(0,0,0,.5)'});
    const R=size/2,KR=Math.round(R*0.42),MAX=R-KR-6;
    const inner=mkEl('',{position:'absolute',width:Math.round(size*0.75)+'px',height:Math.round(size*0.75)+'px',left:Math.round(size*0.125)+'px',top:Math.round(size*0.125)+'px',borderRadius:'50%',background:`radial-gradient(circle at 38% 35%, ${color}cc, ${color}77)`,border:`2px solid ${border}55`,pointerEvents:'none'});
    wrap.appendChild(inner);
    const knob=mkEl('',{position:'absolute',width:KR*2+'px',height:KR*2+'px',borderRadius:'50%',left:(R-KR)+'px',top:(R-KR)+'px',background:`radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), ${border}cc)`,border:`2.5px solid ${border}`,boxShadow:`0 0 18px ${border}bb, 0 4px 16px rgba(0,0,0,.8)`,transition:'none',pointerEvents:'none'});
    wrap.appendChild(knob);
    let active2=false,ox2=0,oy2=0;const THRESH=0.40,AV=0x7fff;
    const sent2={up:0,down:0,left:0,right:0};const DM2={up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
    function sD(d,v){if(sent2[d]===v)return;sent2[d]=v;sendInput(DM2[d],v);}
    function sA(nx,ny){sendInput(EJS_INPUT.LSTICK_RIGHT,nx>0?Math.round(nx*AV):0);sendInput(EJS_INPUT.LSTICK_LEFT,nx<0?Math.round(-nx*AV):0);sendInput(EJS_INPUT.LSTICK_DOWN,ny>0?Math.round(ny*AV):0);sendInput(EJS_INPUT.LSTICK_UP,ny<0?Math.round(-ny*AV):0);}
    function rel(){sD('up',0);sD('down',0);sD('left',0);sD('right',0);sA(0,0);}
    function mv2(dx,dy){const dist=Math.sqrt(dx*dx+dy*dy),cl=Math.min(dist,MAX),ang=Math.atan2(dy,dx);knob.style.transform=`translate(${Math.cos(ang)*cl}px,${Math.sin(ang)*cl}px)`;const nx=Math.cos(ang)*cl/MAX,ny=Math.sin(ang)*cl/MAX;sA(nx,ny);sD('right',nx>THRESH?1:0);sD('left',nx<-THRESH?1:0);sD('down',ny>THRESH?1:0);sD('up',ny<-THRESH?1:0);}
    wrap.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=wrap.getBoundingClientRect();active2=true;ox2=r.left+R;oy2=r.top+R;mv2(t.clientX-ox2,t.clientY-oy2);},{passive:false});
    wrap.addEventListener('touchmove',e=>{if(!active2)return;e.preventDefault();const t=e.touches[0];mv2(t.clientX-ox2,t.clientY-oy2);},{passive:false});
    wrap.addEventListener('touchend',e=>{e.preventDefault();active2=false;knob.style.transition='transform .13s ease';knob.style.transform='translate(0,0)';setTimeout(()=>{knob.style.transition='none';},140);rel();},{passive:false});
    wrap.addEventListener('touchcancel',e=>{e.preventDefault();active2=false;knob.style.transform='translate(0,0)';rel();},{passive:false});
    return wrap;
  }

  const s = skin;
  if(s.analog) pad.appendChild(makeAnalog(s.dpad.color,s.dpad.border,diskCX,diskCY,DS));
  else pad.appendChild(makeDpad(s.dpad.color,s.dpad.border,diskCX,diskCY,DS));
  s.face.forEach((f,i)=>{const p=FPOS[i%4];pad.appendChild(makeBtn(f,Math.round(faceCX+p.dx),Math.round(faceCY+p.dy),BS));});
  s.shoulders.forEach(sh=>{pad.appendChild(makeShoulder(sh,sh.side==='right'?W-MAR-SW:MAR,shY+(sh.row||0)*(SH+4)));});
  if(LS){const lastR=Math.max(0,...s.shoulders.map(sh=>sh.row||0));const my=shY+(lastR+1)*(SH+4)+4;s.meta.forEach((m,i)=>{pad.appendChild(makeMeta(m,(i===s.meta.length-1?W-MAR-MW:MAR)+MW/2,my+MH/2,MW,MH));});}
  else{const g=Math.round(MW*0.15),tw=s.meta.length*MW+(s.meta.length-1)*g,sx=Math.round(W/2-tw/2);s.meta.forEach((m,i)=>{pad.appendChild(makeMeta(m,sx+i*(MW+g)+MW/2,metaCY+MH/2,MW,MH));});}
  pad.classList.add('active');
}

/* ═══════════════════════════════════════════
   SCREENSHOT
═══════════════════════════════════════════ */
function takeScreenshot() {
  try {
    const canvas = document.querySelector('#game canvas');
    if (!canvas) { showToast('Nenhum jogo ativo', 'warning'); return; }
    const dataUrl = canvas.toDataURL('image/png');
    // Download
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `retrovault-web_${core}_${Date.now()}.png`;
    a.click();
    // Salva nas conquistas
    try {
      let screenshots = JSON.parse(RVStore.getItem('rv_screenshots') || '0');
      screenshots = (typeof screenshots === 'number' ? screenshots : 0) + 1;
      RVStore.setItem('rv_screenshots', JSON.stringify(screenshots));
      checkAchievements();
    } catch(e) {}
    showToast('Screenshot salvo!', 'camera');
  } catch(e) {
    showToast('Erro ao capturar tela', 'warning');
  }
}

/* ═══════════════════════════════════════════
   THEATER MODE
═══════════════════════════════════════════ */
let theaterMode = false;

function applyTheaterMode() {
  document.body.classList.toggle('theater-mode', theaterMode);

  const button = document.getElementById('rv-theater-btn');
  if (button) {
    button.setAttribute('aria-pressed', String(theaterMode));
    button.title = theaterMode ? 'Sair do modo Theater' : 'Modo Theater';
  }
}

function toggleTheater() {
  theaterMode = !theaterMode;
  applyTheaterMode();
  // A região touch da tela inferior do NDS precisa seguir o novo tamanho.
  setTimeout(() => { if (typeof window.RV_SYNC_NDS_STYLUS === 'function') window.RV_SYNC_NDS_STYLUS(); }, 100);
  showToast(theaterMode ? 'Modo Theater ativado — controles ocultos' : 'Modo Theater desativado', 'theater');
}

// ESC também fecha o modo imersivo, sem interferir no menu de cheats.
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && theaterMode && !document.body.classList.contains('rv-cheats-open')) {
    theaterMode = false;
    applyTheaterMode();
    showToast('Modo Theater desativado', 'theater');
  }
});

/* ═══════════════════════════════════════════
   TOAST NOTIFICATION
═══════════════════════════════════════════ */
let toastTimeout;
function showToast(msg, icon) {
  const toast = document.getElementById('rv-toast');
  if (!toast) return;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  toast.innerHTML = (icon ? '<img class="rv-inline-icon" src="assets/icons/' + icon + '.svg" alt="">' : '') + esc(msg);
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════════
   ACHIEVEMENTS (Conquistas)
═══════════════════════════════════════════ */
function trackAchievements(consoleKey, gameName) {
  try {
    // Jogos únicos jogados
    let playedGames = JSON.parse(RVStore.getItem('rv_played_games') || '[]');
    const gameId = consoleKey + '/' + gameName;
    if (!playedGames.includes(gameId)) {
      playedGames.push(gameId);
      RVStore.setItem('rv_played_games', JSON.stringify(playedGames));
    }
    // Total de sessões
    let sessions = JSON.parse(RVStore.getItem('rv_sessions') || '0');
    sessions = (typeof sessions === 'number' ? sessions : 0) + 1;
    RVStore.setItem('rv_sessions', JSON.stringify(sessions));
    // Consoles únicos
    let consoles = JSON.parse(RVStore.getItem('rv_consoles_played') || '[]');
    if (!consoles.includes(consoleKey)) {
      consoles.push(consoleKey);
      RVStore.setItem('rv_consoles_played', JSON.stringify(consoles));
    }
    checkAchievements();
  } catch(e) {}
}

function checkAchievements() {
  try {
    const achievements = JSON.parse(RVStore.getItem('rv_achievements') || '{}');
    const playedGames = JSON.parse(RVStore.getItem('rv_played_games') || '[]');
    const sessions = JSON.parse(RVStore.getItem('rv_sessions') || '0');
    const consoles = JSON.parse(RVStore.getItem('rv_consoles_played') || '[]');
    const favorites = JSON.parse(RVStore.getItem('rv_favorites') || '[]');
    const screenshots = JSON.parse(RVStore.getItem('rv_screenshots') || '0');
    let newAchievements = [];

    const defs = [
      { id: 'first_game', name: 'Primeira Aventura', desc: 'Abra seu primeiro jogo', check: () => sessions >= 1 },
      { id: 'five_games', name: 'Explorador', desc: 'Jogue 5 jogos diferentes', check: () => playedGames.length >= 5 },
      { id: 'ten_games', name: 'Veterano', desc: 'Jogue 10 jogos diferentes', check: () => playedGames.length >= 10 },
      { id: 'twenty_games', name: 'Lenda Retro', desc: 'Jogue 20 jogos diferentes', check: () => playedGames.length >= 20 },
      { id: 'three_consoles', name: 'Multiverso', desc: 'Jogue em 3 consoles diferentes', check: () => consoles.length >= 3 },
      { id: 'all_consoles', name: 'Mestre dos Mundos', desc: 'Jogue em todos os consoles', check: () => consoles.length >= 11 },
      { id: 'first_fav', name: 'Favorito!', desc: 'Favorite seu primeiro jogo', check: () => favorites.length >= 1 },
      { id: 'five_favs', name: 'Curador', desc: 'Favorite 5 jogos', check: () => favorites.length >= 5 },
      { id: 'ten_sessions', name: 'Dedicado', desc: 'Abra 10 sessões de jogo', check: () => sessions >= 10 },
      { id: 'fifty_sessions', name: 'Hardcore', desc: 'Abra 50 sessões de jogo', check: () => sessions >= 50 },
      { id: 'first_screenshot', name: 'Fotógrafo', desc: 'Tire seu primeiro screenshot', check: () => screenshots >= 1 },
      { id: 'ten_screenshots', name: 'Galeria', desc: 'Tire 10 screenshots', check: () => screenshots >= 10 },
    ];

    for (const def of defs) {
      if (!achievements[def.id] && def.check()) {
        achievements[def.id] = { name: def.name, desc: def.desc, date: Date.now() };
        newAchievements.push(def);
      }
    }

    if (newAchievements.length > 0) {
      RVStore.setItem('rv_achievements', JSON.stringify(achievements));
      for (const a of newAchievements) {
        showToast(`${a.name}: ${a.desc}`, 'trophy');
      }
    }
  } catch(e) {}
}

/* Bind buttons */
document.getElementById('rv-screenshot-btn').addEventListener('click', takeScreenshot);
document.getElementById('rv-screenshot-btn').addEventListener('touchend', e => { e.preventDefault(); takeScreenshot(); }, {passive:false});
// O evento click também funciona em touch; manter um único listener evita
// ativar/desativar o modo duas vezes no celular.
document.getElementById('rv-theater-btn').addEventListener('click', toggleTheater);

/* ═══════════════════════════════════════════
   MENU DO JOGO SEM CONTROLE NA TELA
   No celular: toque no MENU do overlay = cheats, segurar = barra de saves.
   No PC (ou com gamepad) o overlay não existe — F1 espelha esse comportamento
   (toque = cheats, segurar ~500ms = saves) e o botão flutuante abre os saves.
     F1 = cheats (segurar = saves)   F2 = salvar   F4 = carregar
═══════════════════════════════════════════ */
(function bindSysBarShortcuts() {
  const btn = document.getElementById('rv-sysbar-btn');
  if (btn) btn.addEventListener('click', () => openRvSystemBar());

  /* F1 espelha o botão MENU do touch: toque rápido = cheats, segurar = saves. */
  let f1Down = 0, f1Held = false, f1Timer = 0;
  document.addEventListener('keydown', (event) => {
    if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
    const tag = (event.target && event.target.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;

    if (event.key === 'F1') {
      event.preventDefault();
      f1Down = Date.now(); f1Held = false;
      clearTimeout(f1Timer);
      f1Timer = setTimeout(() => { f1Held = true; openRvSystemBar(); }, 500);
    }
    else if (event.key === 'F2') { event.preventDefault(); rvSaveNow(); }
    else if (event.key === 'F4') { event.preventDefault(); rvLoadNow(); }
  });
  document.addEventListener('keyup', (event) => {
    if (event.key !== 'F1' || !f1Down) return;
    clearTimeout(f1Timer);
    if (!f1Held) openRvCheats(); // soltou rápido = cheats (segurou = barra já abriu)
    f1Down = 0; f1Held = false;
  });
})();

/* Fullscreen */
function requestFS(){const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);}
// O botão some EM fullscreen e VOLTA ao sair (ESC, gesto ou chamada) —
// antes ele era escondido no clique e nunca mais reaparecia.
function syncFsBtnVisibility(){
  const btn=document.getElementById('rv-fs-btn');
  if(!btn) return;
  const inFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  btn.style.display = inFs ? 'none' : '';
}
['fullscreenchange','webkitfullscreenchange'].forEach(evt=>document.addEventListener(evt,syncFsBtnVisibility));
document.getElementById('rv-fs-btn').addEventListener('click',requestFS);
document.getElementById('rv-fs-btn').addEventListener('touchend',e=>{e.preventDefault();requestFS();},{passive:false});

/* ═══ HUD DE DIAGNÓSTICO DE TOQUES (?paddebug=1) ═══
   Mostra no canto da tela, em tempo real, cada input que o controle
   entrega ao núcleo. Serve para diagnosticar no CELULAR o que chega
   quando um botão é pressionado. Não interfere no jogo. */
(function initPadDebugHUD() {
  const viaUrl = /[?&]paddebug=1/.test(location.search);
  let viaPrefs = false;
  try { viaPrefs = RVStore.getItem('rv_paddebug') === '1'; } catch (e) { }
  if (!viaUrl && !viaPrefs) return;
  const hud = document.createElement('div');
  hud.id = 'rv-pad-hud';
  hud.style.cssText = [
    'position:fixed', 'top:calc(64px + env(safe-area-inset-top,0px))', 'left:8px',
    'z-index:9999', 'background:rgba(0,0,0,.82)', 'border:1px solid #00ff41',
    'border-radius:8px', 'color:#00ff41', "font:11px/1.6 'Courier New',monospace",
    'padding:7px 10px', 'max-width:64vw', 'pointer-events:none', 'white-space:pre-wrap',
    'text-shadow:0 0 6px rgba(0,255,65,.6)'
  ].join(';');
  hud.textContent = 'HUD-TOQUE: aguardando...';
  document.body.appendChild(hud);
  const linhas = [];
  window.__rvPadHUD = function (input, pressed) {
    linhas.push(input + (pressed ? ' ON' : ' off'));
    if (linhas.length > 8) linhas.shift();
    hud.textContent = 'HUD-TOQUE: ' + linhas.join(' | ');
  };
  window.addEventListener('touchstart', function once() {
    hud.textContent = 'HUD-TOQUE: touch ok, aguardando input...';
    window.removeEventListener('touchstart', once);
  });
})();

/* Resize/orientation — só reconstrói se o aparelho realmente usa controle na tela */
function rvNeedsVirtualPad() {
  return window.RVInput ? RVInput.shouldShowVirtualPad() : isTouch;
}
window.addEventListener('orientationchange',()=>{setTimeout(()=>{if(rvNeedsVirtualPad())initControls();},350);});
window.addEventListener('resize',()=>{
  if(rvNeedsVirtualPad()){
    const has=document.getElementById('rv-overlay').classList.contains('active')||document.getElementById('rv-pad').classList.contains('active');
    if(has) initControls();
  }
});
