<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/rv-icon.png">
  <link rel="apple-touch-icon" href="assets/rv-icon.png">
  <link rel="manifest" href="manifest.json">
  <!-- Boot rápido: abre a conexão com o CDN dos núcleos antes de o jogo pedir -->
  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.emulatorjs.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap">
  <title>RetroVault OS</title>
  <!-- Defesa: o EmulatorJS consulta MediaRecorder.isTypeSupported SEM checar
       se a API existe. Em navegadores sem MediaRecorder (WebKit/Safari antigo,
       alguns WebViews e shells de PWA) a referência crua lançava ReferenceError
       e QUEBRAVA o boot: tela preta, controles aparentemente vivos, jogo morto
       ("toques recebidos, jogo não responde"). O stub só desativa a gravação. -->
  <script>
    if (typeof window.MediaRecorder === 'undefined') {
      window.MediaRecorder = function () { };
      window.MediaRecorder.isTypeSupported = function () { return false; };
    }
    window.addEventListener('error', function (e) {
      window.__rvLastError = String((e.error && e.error.message) || e.message || '');
    });
  </script>
  <!-- Conta/sessão: precisa vir ANTES de tudo que lê histórico, porque
       RVStore separa os dados por usuário (rv:<uid>:chave). -->
  <script src="js/rv-config.js?v=7"></script>
  <script src="js/rv-account.js?v=70260922"></script>
  <script src="js/rv-input-mode.js?v=70260922"></script>
  <script>RVAccount.guard();</script>
  <script src="js/audio.js?v=70260922"></script>
  <script src="js/overlay-parser.js?v=70260922"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ═══ POSIÇÃO/TAMANHO DA TELA DO JOGO ═══
       Altere estas quatro variáveis para ajustar a imagem do jogo
       por baixo da moldura do overlay. O padrão ocupa a viewport inteira.
       Exemplo: top: 8vh; height: 42vh;
    ═══════════════════════════════════════════ */
    :root {
      --rv-game-left: 0px;
      --rv-game-top: 0px;
      --rv-game-width: 100vw;
      --rv-game-height: 100vh;
    }

    #game {
      position: fixed;
      left: var(--rv-game-left);
      top: var(--rv-game-top);
      width: var(--rv-game-width);
      height: var(--rv-game-height);
      z-index: 1;
      background: #000;
    }

    /* LOADING 2.0 (personalizado por console via --rv-color/--rv-glow) */
    #rv-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #020503;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      transition: opacity 0.7s ease, visibility 0.7s ease;
      font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
    #rv-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .rv-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 50% 38%, var(--rv-glow, rgba(0,255,65,.16)) 0%, transparent 62%),
        radial-gradient(700px 340px at 50% 110%, rgba(0,140,255,.08), transparent 60%),
        #020503;
    }
    .rv-bg::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at 50% 45%, black 25%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 25%, transparent 72%);
    }
    .rv-bg::after {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.16) 3px,rgba(0,0,0,.16) 4px);
      animation: scanPulse 4s linear infinite;
    }
    @keyframes scanPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    .rv-load-ring {
      position: relative; z-index: 1;
      width: 132px; height: 132px;
      display: flex; align-items: center; justify-content: center;
    }
    .rv-load-ring::before {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%;
      border: 1px dashed var(--rv-color, rgba(0,255,65,.5));
      opacity: .55;
      animation: ringSpin 14s linear infinite;
    }
    .rv-load-ring::after {
      content: ''; position: absolute; inset: 10px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: var(--rv-color, #00ff41);
      border-right-color: var(--rv-color, #00ff41);
      opacity: .8;
      animation: ringSpin 1.6s linear infinite;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }
    .rv-logo {
      position: relative; z-index: 1;
      width: 84px; height: 84px;
      border: 2.5px solid var(--rv-color, #00ff41); border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
      font-size: 1.9rem; font-weight: 900; color: var(--rv-color, #00ff41); letter-spacing: 2px;
      background: linear-gradient(160deg, rgba(255,255,255,.05), transparent 60%), #040a06;
      text-shadow: 0 0 14px var(--rv-color, #00ff41);
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100%{ box-shadow: 0 0 22px var(--rv-glow, rgba(0,255,65,.6)), 0 0 60px var(--rv-glow, rgba(0,255,65,.2)), inset 0 0 20px var(--rv-glow, rgba(0,255,65,.08)); }
      50%    { box-shadow: 0 0 40px var(--rv-glow, rgba(0,255,65,.9)), 0 0 100px var(--rv-glow, rgba(0,255,65,.35)), inset 0 0 30px var(--rv-glow, rgba(0,255,65,.15)); }
    }
    .rv-console-title {
      position: relative; z-index: 1;
      font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
      font-size: 1.25rem; font-weight: 900; letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 16px var(--rv-glow, rgba(0,255,65,.7));
      text-transform: uppercase;
    }
    .rv-game-sub {
      position: relative; z-index: 1;
      font-size: .95rem; font-weight: 600; letter-spacing: 1.5px;
      color: rgba(255,255,255,.55);
      max-width: 34ch;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rv-name { position: relative; z-index: 1; font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif; font-size: 1.1rem; font-weight: 900; letter-spacing: 5px; text-indent: 5px; color: #fff; text-shadow: 0 0 20px rgba(0,255,65,.7); }
    .rv-slogan { position: relative; z-index: 1; font-size: .68rem; font-weight: 700; letter-spacing: 5px; text-indent: 5px; color: var(--rv-color, #00ff41); text-transform: uppercase; opacity: .85; }
    .rv-bar-wrap { position: relative; z-index: 1; width: 230px; height: 4px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .rv-bar { height: 100%; width: 40%; background: linear-gradient(90deg, transparent, var(--rv-color, #00ff41)); border-radius: 4px; box-shadow: 0 0 12px var(--rv-color, #00ff41); animation: barSweep 1.6s ease-in-out infinite; }
    @keyframes barSweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
    .rv-msg { position: relative; z-index: 1; font-size: .72rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--rv-color, rgba(0,255,65,.6)); }

    #rv-download-progress { position: relative; z-index: 2; display: none; flex-direction: column; align-items: center; gap: 10px; width: min(320px, 80vw); background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px 18px; backdrop-filter: blur(8px); }
    #rv-download-progress.visible { display: flex; }
    .rv-dl-title { font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 3px; color: var(--rv-color, rgba(0,255,65,0.75)); text-transform: uppercase; }
    .rv-dl-bar-wrap { width: 100%; height: 5px; background: rgba(0,255,65,0.12); border-radius: 5px; overflow: hidden; }
    .rv-dl-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--rv-color, #00ff41), #7dffb0); border-radius: 5px; box-shadow: 0 0 12px var(--rv-color, #00ff41); transition: width 0.3s ease; }
    .rv-dl-info { font-size: 0.74rem; font-weight: 600; letter-spacing: 2px; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }

    /* ═══ MINI-MENU DE OPÇÕES DA TELA ═══
       Recolhido: apenas o botão ⋮ (pequeno e discreto, não cobre o jogo).
       Aberto: painel vertical com Tela cheia / Screenshot / Theater / Saves. */
    .rv-qm {
      position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; z-index: 8000;
      display: none; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    .rv-qm.visible { display: flex; }
    .rv-qm-toggle {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(3,8,5,.55); border: 1px solid rgba(0,255,65,.22);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0,0,0,.45);
      opacity: .5; padding: 0;
      transition: opacity .2s, transform .15s, border-color .2s, background .2s;
    }
    .rv-qm-toggle:hover, .rv-qm-toggle:focus-visible { opacity: 1; border-color: rgba(0,255,65,.45); }
    .rv-qm-toggle:active { transform: scale(.9); }
    .rv-qm-toggle svg { width: 18px; height: 18px; fill: #00ff41; pointer-events: none; }
    .rv-qm.open .rv-qm-toggle { opacity: 1; background: rgba(0,255,65,.14); border-color: rgba(0,255,65,.45); }
    @keyframes rvQmIn { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
    /* Os botões originais viram itens do painel (antes eram fixos na tela) */
    .rv-qm #rv-fs-btn, .rv-qm .rv-float-btn { position: static; }
    #rv-fs-btn {
      background: rgba(3,8,5,.5); border: 1px solid transparent;
      border-radius: 10px; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease, border-color .2s ease;
    }
    #rv-fs-btn.visible { display: flex; }
    #rv-fs-btn:hover { background: rgba(0,255,65,.12); border-color: rgba(0,255,65,.35); box-shadow: none; }
    #rv-fs-btn:active { transform: scale(.92); }
    #rv-fs-btn svg { width: 19px; height: 19px; fill: #00ff41; }

    /* ═══════════════════════════════════════════
       FLOATING BUTTONS (screenshot, theater, menu)
    ═══════════════════════════════════════════ */
    /* Painel do mini-menu (era a barra fixa; agora é o dropdown do ⋮) */
    .rv-float-btns {
      position: static;
      display: none;
      flex-direction: column;
      gap: 4px;
      background: rgba(3,8,5,.8);
      border: 1px solid rgba(0,255,65,.3);
      border-radius: 14px;
      padding: 5px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
    }
    .rv-qm.open .rv-float-btns { display: flex; animation: rvQmIn .18s ease; }

    .rv-float-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, border-color .2s;
      position: relative;
    }
    .rv-float-btn:hover { background: rgba(0,255,65,.12); border-color: rgba(0,255,65,.35); }
    .rv-float-btn:active { transform: scale(0.9); background: rgba(0,255,65,.3); }
    .rv-float-btn svg { width: 19px; height: 19px; fill: #00ff41; pointer-events: none; }

    /* Toast notification (screenshot salvo) */
    .rv-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(3,8,5,0.92);
      border: 1px solid rgba(0,255,65,0.45);
      border-radius: 14px;
      padding: 12px 26px;
      font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #00ff41;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 24px rgba(0,255,65,.15);
      white-space: nowrap;
    }
    .rv-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .rv-toast .rv-inline-icon {
      width: 1.05em; height: 1.05em;
      vertical-align: -0.23em;
      margin-right: 8px;
    }

    /* ═══ MENU DE CHEATS SOBRE TODOS OS CONTROLES ═══ */
    body.rv-cheats-open .ejs_popup_container {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 100000 !important;
      /* Deixa o botão MENU do overlay receber o segundo clique. */
      pointer-events: none !important;
    }

    /* Somente os controles da lista continuam interativos. */
    body.rv-cheats-open .ejs_popup_container .ejs_button,
    body.rv-cheats-open .ejs_popup_container .ejs_button_button,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_row,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_row *,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_parent,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_parent * {
      pointer-events: auto !important;
    }

    /* ═══════════════════════════════════════════
       THEATER MODE
       Modo imersivo: oculta a moldura/controles touch e deixa
       somente a tela do emulador ocupando a viewport.
    ═══════════════════════════════════════════ */
    body.theater-mode #game {
      left: 0 !important;
      top: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 10;
    }

    body.theater-mode #rv-overlay,
    body.theater-mode #rv-pad {
      display: none !important;
      pointer-events: none !important;
    }

    body.theater-mode .rv-qm { opacity: 0.35; z-index: 8000; }
    body.theater-mode .rv-qm:hover { opacity: 1; }
    body.theater-mode #rv-theater-btn {
      border-color: #00ff41;
      box-shadow: 0 0 14px rgba(0,255,65,.45);
    }

    /* ═══════════════════════════════════════════
       OVERLAY SYSTEM
       Container posicionado no bottom com a imagem
       e zonas de toque transparentes por cima
    ═══════════════════════════════════════════ */
    /* Aparelho sem necessidade de controle na tela (PC, ou gamepad
       conectado): nada de overlay, nem por engano. */
    body.rv-no-virtualpad #rv-overlay,
    body.rv-no-virtualpad #rv-pad { display: none !important; }

    #rv-overlay {
      position: fixed;
      bottom: 0; left: 0;
      z-index: 5000;
      pointer-events: none;
      display: none;
      overflow: visible;
      max-height: 100vh;
    }
    #rv-overlay.active { display: block; }

    /* Área transparente da tela inferior do Nintendo DS.
       Fica ACIMA do overlay (z 5000): o parser RetroArch usa hit-test de tela
       cheia no container (#rv-overlay pointer-events:auto), então a camada
       precisa estar acima para receber os toques da tela touch, que são
       encaminhados ao core do DeSmuME. Botões do overlay ficam fora dessa
       região (moldura/bisel), então não são bloqueados. */
    #rv-nds-stylus-layer {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      bottom: 0;
      z-index: 5010;
      display: none;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: transparent;
    }
    #rv-nds-stylus-layer.active { display: block; }
    /* Teatro NÃO esconde a camada touch do NDS — ela segue a tela inferior
       em qualquer modo (sem ela, o teatro tornava NDS injogável). */
    body.rv-cheats-open #rv-nds-stylus-layer { display: none !important; }

    /* ═══ MINI-BARRA DE AÇÕES DE SISTEMA ═══
       Abre ao SEGURAR o botão MENU do overlay (~500ms); toque rápido = cheats.
       Ícones em SVG (padrão do projeto) — nada de emoji. */
    #rv-sys-bar {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(16px) scale(.98);
      z-index: 6000;
      display: none;
      flex-direction: column;
      gap: 9px;
      width: min(92vw, 420px);
      padding: 14px;
      background: rgba(5, 10, 7, 0.94);
      border: 1px solid rgba(0, 255, 65, 0.45);
      border-radius: 18px;
      box-shadow: 0 12px 44px rgba(0, 0, 0, 0.7), 0 0 28px rgba(0, 255, 65, 0.16), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      transition: opacity 0.22s cubic-bezier(.22,1,.36,1), transform 0.22s cubic-bezier(.22,1,.36,1);
      font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
    }
    #rv-sys-bar.open { display: flex; opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    #rv-sys-bar .rv-sys-head {
      display: flex; align-items: baseline; gap: 8px;
      padding: 0 2px; min-width: 0;
    }
    #rv-sys-bar .rv-sys-game {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #eafff0; font-size: 14px; font-weight: 700; letter-spacing: 0.4px;
    }
    #rv-sys-bar .rv-sys-core {
      color: #00ff41; font-family: 'Orbitron', sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: 2px; flex-shrink: 0;
      border: 1px solid rgba(0,255,65,.4); background: rgba(0,255,65,.08);
      padding: 3px 9px; border-radius: 20px;
    }
    #rv-sys-bar .rv-sys-save-row {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px;
      background: rgba(0, 255, 65, 0.06);
      border: 1px solid rgba(0, 255, 65, 0.22);
      border-radius: 12px;
    }
    #rv-sys-bar .rv-sys-save-row svg { width: 15px; height: 15px; stroke: #00ff41; flex-shrink: 0; }
    #rv-sys-bar .rv-sys-save-info {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #bfe8c8; font-size: 12.5px; font-weight: 600;
    }
    #rv-sys-bar .rv-sys-actions { display: flex; gap: 7px; }
    #rv-sys-bar .rv-sys-actions button {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-width: 50px; padding: 9px 8px;
      background: rgba(0, 255, 65, 0.07);
      border: 1px solid rgba(0, 255, 65, 0.35);
      border-radius: 12px; color: #d8ffe0;
      font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px;
      cursor: pointer; touch-action: manipulation;
      transition: background .18s, transform .12s, box-shadow .2s;
    }
    #rv-sys-bar .rv-sys-actions button:hover { background: rgba(0,255,65,.15); box-shadow: 0 0 14px rgba(0,255,65,.2); }
    #rv-sys-bar .rv-sys-actions button svg.ico { width: 19px; height: 19px; stroke: currentColor; }
    #rv-sys-bar button.rv-del {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0;
      background: rgba(255, 60, 60, 0.10);
      border: 1px solid rgba(255, 90, 90, 0.45);
      border-radius: 9px; color: #ffb3b3;
      cursor: pointer; touch-action: manipulation; flex-shrink: 0;
      transition: background .18s, transform .12s;
    }
    #rv-sys-bar button.rv-del:hover { background: rgba(255,60,60,.22); }
    #rv-sys-bar button.rv-del svg { width: 14px; height: 14px; stroke: currentColor; }
    #rv-sys-bar button:active { transform: scale(0.94); }
    #rv-sys-bar button.on {
      background: rgba(0, 255, 65, 0.28);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.5);
      color: #00ff41;
    }
    #rv-sys-bar .rv-sys-actions button.rv-dim { opacity: 0.35; }
    #rv-sys-bar .rv-sys-actions button.rv-close { flex: 0 0 auto; min-width: 0; }
    body.rv-cheats-open #rv-sys-bar { display: none !important; }
    /* Sprite SVG compartilhado (ícones de sistema) — invisível. */
    #rv-svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    #rv-overlay img.rv-skin-img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    /* Imagem animated (feedback de pressionar) */
    #rv-overlay img.rv-anim-img {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: auto;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.06s ease;
    }
    #rv-overlay img.rv-anim-img.show { opacity: 1; }

    /* Zonas de toque */
    .rv-zone {
      position: absolute;
      pointer-events: auto;
      touch-action: none;

<script>
const params = new URLSearchParams(window.location.search);
let core = params.get('core') || 'snes';
// Garante que 'game' não carregue query string embutida (ex: "...nes?debug=1")
// — remove qualquer '?' que apareça DENTRO do valor do game.
let game = (params.get('game') || '').split('?')[0];
if (core === 'mupen64plus' || core === 'mupen64plus_next') core = 'n64';
if (core === 'melonds' || core === 'desmume' || core === 'desmume2015') core = 'nds';

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ═══ Cores temáticas para loading screen ═══ */
const CONSOLE_THEMES = {
  snes:         { name: 'Super Nintendo',     color: '#7B2D8E', glow: 'rgba(123,45,142,0.5)' },
  nes:          { name: 'Nintendo Classic',   color: '#E4002B', glow: 'rgba(228,0,43,0.5)' },
  gba:          { name: 'Game Boy Advance',   color: '#6B2FA0', glow: 'rgba(107,47,160,0.5)' },
  gbc:          { name: 'Game Boy Color',     color: '#00A651', glow: 'rgba(0,166,81,0.5)' },
  n64:          { name: 'Nintendo 64',        color: '#E4000F', glow: 'rgba(228,0,15,0.5)' },
  pcsx_rearmed: { name: 'PlayStation 1',      color: '#1560BD', glow: 'rgba(21,96,189,0.5)' },
  segaMD:       { name: 'Mega Drive',         color: '#003087', glow: 'rgba(0,48,135,0.5)' },
  segaCD:       { name: 'Sega CD',            color: '#1A1AFF', glow: 'rgba(26,26,255,0.5)' },
  segaGG:       { name: 'Game Gear',          color: '#CC0000', glow: 'rgba(204,0,0,0.5)' },
  segaMS:       { name: 'Master System',      color: '#ff5a5a', glow: 'rgba(255, 90, 90, 0.5)' },
  atari2600:    { name: 'Atari 2600',         color: '#e8963c', glow: 'rgba(232, 150, 60, 0.5)' },
  nds:          { name: 'Nintendo DS',        color: '#00BFFF', glow: 'rgba(0,191,255,0.5)' },
  fbneo:        { name: 'Arcade',             color: '#00FF41', glow: 'rgba(0,255,65,0.5)' },
};

// Aplica cores temáticas na loading screen
(function applyConsoleTheme() {
  const theme = CONSOLE_THEMES[core] || { name: 'RetroVault Web', color: '#00ff41', glow: 'rgba(0,255,65,0.5)' };
  const loading = document.getElementById('rv-loading');
  if (loading) {
    loading.style.setProperty('--rv-color', theme.color);
    loading.style.setProperty('--rv-glow', theme.glow);
  }
  const titleEl = document.getElementById('rv-console-title');
  if (titleEl) titleEl.textContent = theme.name;

  // Salvar no "Continue Jogando" (localStorage)
  try {
    const gameName = decodeURIComponent(game || '').split('/').pop().replace(/\.[^/.]+$/, '');
    const consoleKey = (game || '').split('/')[0];
    const consoleShorts = {snes:'SNES',nes:'NES',gba:'GBA',gbc:'GBC',n64:'N64',pcsx_rearmed:'PS1',segaMD:'SEGA',segaCD:'MEGA CD',segaGG:'GG',nds:'NDS',fbneo:'ARCADE'};
    const entry = {
      name: gameName.substring(0, 40),
      subtitle: '',
      file: decodeURIComponent(game || '').split('/').pop(),
      core: core,
      console: consoleKey,
      consoleShort: consoleShorts[core] || core.toUpperCase(),
      timestamp: Date.now()
    };
    let recent = JSON.parse(RVStore.getItem('rv_recent') || '[]');
    recent = recent.filter(r => r.file !== entry.file || r.console !== entry.console);
    recent.unshift(entry);
    recent = recent.slice(0, 8);
    RVStore.setItem('rv_recent', JSON.stringify(recent));
  } catch(e) {}
})();

   EMULATORJS
═══════════════════════════════════════════════════════════ */
const ROMS_BASE = 'https://retroverse-roms.mdsoltec.workers.dev/';

async function preloadGame(gamePath) {
  // Codifica cada segmento do path para lidar com apóstrofos e caracteres especiais
  const encodedPath = gamePath.split('/').map(seg => 
    encodeURIComponent(seg).replace(/'/g, '%27')
  ).join('/');

  // Lista de fontes para tentar carregar a ROM.
  // Game Gear aparece no catálogo como "gamegear", mas alguns projetos
  // guardam as ROMs em "gg" ou "segaGG". Tentamos os aliases sem quebrar
  // os caminhos originais dos demais consoles.
  const pathParts = gamePath.split('/');
  const systemKey = pathParts.shift() || '';
  const filenamePath = pathParts.join('/');
  const aliases = {
    gamegear: ['gamegear', 'GameGear', 'GAMEGEAR', 'gg', 'GG', 'segaGG'],
    segaGG: ['segaGG', 'gamegear', 'GameGear', 'gg', 'GG'],
  }[systemKey] || [systemKey];

  const candidateUrls = [];
  for (const alias of [...new Set(aliases)]) {
    const segs = filenamePath.split('/');
    candidateUrls.push(`roms/${alias}/${segs.map(seg => encodeURIComponent(seg)).join('/')}`);
    candidateUrls.push(`roms/${alias}/${filenamePath}`);
    candidateUrls.push(ROMS_BASE + `${alias}/${segs.map(seg => encodeURIComponent(seg)).join('/')}`);
    // Chave dupla-codificada: alguns arquivos no bucket B2 foram gravados com
    // o nome já url-encodado (ex.: "Arquivo%20(USA%2C%20Europe).sms" literal).
    // A tentativa dupla-codificada cobre esses casos sem afetar os demais.
    candidateUrls.push(ROMS_BASE + `${alias}/${segs.map(seg => encodeURIComponent(encodeURIComponent(seg))).join('/')}`);
  }
  candidateUrls.push(`roms/${encodedPath}`, `roms/${gamePath}`, ROMS_BASE + encodedPath,
                     ROMS_BASE + encodedPath.split('/').map(seg => encodeURIComponent(encodeURIComponent(seg))).join('/'));

  const msgEl = document.getElementById('rv-msg');
  const dlWrap = document.getElementById('rv-download-progress');
  const dlBar = document.getElementById('rv-dl-bar');
  const dlInfo = document.getElementById('rv-dl-info');

  let response = null;
  for (const url of candidateUrls) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        response = res;
        // Registra se a ROM veio do servidor remoto: BIOS e demais anexos
        // precisam vir da MESMA fonte (roms/ local não existe no GitHub Pages).
        window.__rvRomFromRemote = url.startsWith(ROMS_BASE);
        console.log('[RetroVault Web] ROM carregada com sucesso de:', url);
        break;
      }
    } catch(err) {
      // Tenta a próxima fonte
    }
  }

  if (!response) {
    console.error('[RetroVault Web] ROM não encontrada. URLs tentadas:', candidateUrls);
    msgEl.textContent = 'Erro: ROM não encontrada em roms/ nem no servidor online.';
    throw new Error('ROM não encontrada em nenhuma fonte.');
  }

  try {
    const total = parseInt(response.headers.get('Content-Length') || '0');
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    if (total > 0) { msgEl.style.display = 'none'; dlWrap.classList.add('visible'); }
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length;
      if (total > 0) {
        dlBar.style.width = Math.round((received/total)*100) + '%';
        dlInfo.textContent = `${(received/1048576).toFixed(1)} MB / ${(total/1048576).toFixed(1)} MB`;
      }
    }
    dlWrap.classList.remove('visible'); msgEl.style.display = ''; msgEl.textContent = 'Iniciando emulador...';
    const fn = gamePath.split('/').pop();
    const mt = fn.endsWith('.zip') ? 'application/zip' : 'application/octet-stream';
    if (fn.endsWith('.zip')) return URL.createObjectURL(new File(chunks, fn, {type:mt}));
    return URL.createObjectURL(new Blob(chunks, {type:mt}));
  } catch(e) { msgEl.textContent = 'Erro ao baixar.'; throw e; }
}

// O core DeSmuME 2015 expõe Pointer/Touch para a tela inferior do DS.
// Mantemos `core = 'nds'` para catálogo, overlays e cheats, mas usamos
// desmume2015 internamente para habilitar o stylus no navegador.
const isNDSCore = ['nds', 'melonds', 'desmume', 'desmume2015'].includes(core);
// Gambatte ('gb' no EmulatorJS) emula tanto GB quanto GBC; o EJS não possui
// um core chamado 'gbc' (gbc-wasm.data não existe → 404). Mantemos
// `core = 'gbc'` para catálogo, overlays, temas e cheats.
const isGBCCore = core === 'gbc';

/* ═══ STYLUS / TOUCH DO NINTENDO DS ═══ */
// Frações do canvas onde fica a tela touch (metade inferior do vídeo empilhado).
// Os valores são recalculados em tempo de execução por syncNDSStylusRegion():
// o EJS desenha o vídeo com letterbox dentro de um canvas do tamanho da tela,
// então assumir top:0.50 do VIEWPORT deixa parte da tela touch sem resposta.
const NDS_TOUCH_REGION = { top: 0.50, bottom: 1, left: 0, right: 1 };

// Posiciona a camada de stylus exatamente sobre a tela inferior do DS e
// recalibra NDS_TOUCH_REGION. O EJS desenha o vídeo com letterbox TOP-ALINHADO
// e centralizado horizontalmente dentro do canvas; como o play fixa o layout
// 'top/bottom' do DeSmuME, o vídeo são duas telas 256x192 empilhadas (256x384).
function syncNDSStylusRegion() {
  if (!isNDSCore) return false;
  const canvas = getNDSCanvas();
  const layer = document.getElementById('rv-nds-stylus-layer');
  if (!canvas) return false;
  const el = canvas.getBoundingClientRect();
  if (!el.width || !el.height) return false;

  const scale = Math.min(el.width / 256, el.height / 384);
  const videoW = 256 * scale;
  const videoH = 384 * scale;
  const videoLeft = el.left + (el.width - videoW) / 2;
  const videoTop = el.top;

  const touch = { left: videoLeft, top: videoTop + videoH / 2, right: videoLeft + videoW, bottom: videoTop + videoH };
  NDS_TOUCH_REGION.left = (touch.left - el.left) / el.width;
  NDS_TOUCH_REGION.right = (touch.right - el.left) / el.width;
  NDS_TOUCH_REGION.top = (touch.top - el.top) / el.height;
  NDS_TOUCH_REGION.bottom = (touch.bottom - el.top) / el.height;

  if (layer) {
    layer.style.left = touch.left + 'px';
    layer.style.top = touch.top + 'px';
    layer.style.width = (touch.right - touch.left) + 'px';
    layer.style.height = (touch.bottom - touch.top) + 'px';
    layer.style.right = 'auto';
    layer.style.bottom = 'auto';
  }
  return true;
}

window.RV_SYNC_NDS_STYLUS = syncNDSStylusRegion;

function getNDSCanvas() {
  return document.querySelector('#game canvas') || window.EJS_emulator?.canvas || null;
}

function forwardNDSStylus(action, point) {
  if (!isNDSCore || !point) return false;
  const canvas = getNDSCanvas();
  if (!canvas) return false;

  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return false;
  const clientX = Number(point.clientX);
  const clientY = Number(point.clientY);
  if (!Number.isFinite(clientX) || !Number.isFinite(clientY)) return false;

  const nx = (clientX - rect.left) / rect.width;
  const ny = (clientY - rect.top) / rect.height;
  const active = action !== 'end';
  const inside = nx >= NDS_TOUCH_REGION.left && nx <= NDS_TOUCH_REGION.right
    && ny >= NDS_TOUCH_REGION.top && ny <= NDS_TOUCH_REGION.bottom;
  if (!inside && action === 'start') return false;

  const pointerType = point.pointerType || 'touch';
  const pointerId = point.pointerId ?? point.identifier ?? 1;
  const pointerEventName = action === 'start' ? 'pointerdown'
    : action === 'end' ? 'pointerup' : 'pointermove';
  const mouseEventName = action === 'start' ? 'mousedown'
    : action === 'end' ? 'mouseup' : 'mousemove';
  const buttons = active ? 1 : 0;

  // DeSmuME 2015 com desmume_pointer_type=touch usa Pointer API.
  try {
    if (window.PointerEvent) {
      canvas.dispatchEvent(new PointerEvent(pointerEventName, {
        bubbles: true,
        cancelable: true,
        pointerId,
        pointerType,
        isPrimary: true,
        clientX,
        clientY,
        screenX: point.screenX ?? clientX,
        screenY: point.screenY ?? clientY,
        buttons,
        button: active ? 0 : 0,
        pressure: active ? 0.5 : 0
      }));
    }
  } catch (error) {}

  // Fallback para builds que expõem a tela como Mouse API.
  try {
    canvas.dispatchEvent(new MouseEvent(mouseEventName, {
      bubbles: true,
      cancelable: true,
      clientX,
      clientY,
      screenX: point.screenX ?? clientX,
      screenY: point.screenY ?? clientY,
      buttons,
      button: 0
    }));
  } catch (error) {}

  return true;
}

window.RV_NDS_STYLUS = forwardNDSStylus;

// Tenta calibrar a camada até o canvas existir; depois reage a resize,
// rotação, fullscreen/teatro e a mudanças de tamanho do próprio canvas.
function startNDSStylusSync(layer) {
  if (window.__rvNdsSyncTimer) return;
  let attempts = 0;
  const activar = ok => {
    if (!ok) return false;
    layer.classList.add('active');
    if (!window.__rvNdsSyncListeners) {
      window.__rvNdsSyncListeners = true;
      ['resize', 'orientationchange', 'fullscreenchange'].forEach(evt =>
        window.addEventListener(evt, () => syncNDSStylusRegion()));
      const canvas = getNDSCanvas();
      if (canvas && window.ResizeObserver) {
        try { new ResizeObserver(() => syncNDSStylusRegion()).observe(canvas); } catch (error) {}
      }
    }
    return true;
  };
  if (activar(syncNDSStylusRegion())) return;
  window.__rvNdsSyncTimer = setInterval(() => {
    attempts++;
    if (activar(syncNDSStylusRegion()) || attempts > 120) {
      clearInterval(window.__rvNdsSyncTimer);
      window.__rvNdsSyncTimer = null; // libera nova tentativa se o boot falhou
    }
  }, 500);
}

function initNDSStylus() {
  if (!isNDSCore) return;
  const layer = document.getElementById('rv-nds-stylus-layer');
  if (!layer || layer.dataset.bound === '1') {
    if (layer) startNDSStylusSync(layer);
    return;
  }

  const activePointers = new Set();
  const pointerIdOf = event => event.pointerId ?? 1;

  layer.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    if (!forwardNDSStylus('start', event)) return;
    activePointers.add(pointerIdOf(event));
    try { layer.setPointerCapture(pointerIdOf(event)); } catch (error) {}
    event.preventDefault();
  }, { passive: false });

  layer.addEventListener('pointermove', event => {
    if (!activePointers.has(pointerIdOf(event))) return;
    forwardNDSStylus('move', event);
    event.preventDefault();
  }, { passive: false });

  const finish = event => {
    const id = pointerIdOf(event);
    if (!activePointers.has(id)) return;
    forwardNDSStylus('end', event);
    activePointers.delete(id);
    try { layer.releasePointerCapture(id); } catch (error) {}
    event.preventDefault();
  };

  layer.addEventListener('pointerup', finish, { passive: false });
  layer.addEventListener('pointercancel', finish, { passive: false });
  window.addEventListener('blur', () => {
    activePointers.clear();
  });

  layer.dataset.bound = '1';
  startNDSStylusSync(layer);
}

// Troca o menu genérico (hambúrguer) pelo menu de cheats.

function openRvCheats() {
  const emulator = window.EJS_emulator;
  const cheatMenu = emulator?.cheatMenu;
  if (!emulator || !cheatMenu) return;

  const isOpen = getComputedStyle(cheatMenu).display !== 'none';
  if (isOpen) {
    // Segundo clique no menu: fecha a lista de cheats.
    cheatMenu.style.display = 'none';
    document.body.classList.remove('rv-cheats-open');
    if (emulator.menu?.close) emulator.menu.close();
    return;
  }

  // Fecha a caixa genérica de screenshot/save/recording, se estiver aberta.
  if (emulator.elements?.contextmenu) {
    emulator.elements.contextmenu.style.display = 'none';
  }
  if (emulator.menu?.close) {
    emulator.menu.close();
  }

  // O popup nasce dentro de #game, mas o overlay de controles fica acima dele.
  // Movê-lo para o body garante que a lista e os checkboxes recebam cliques.
  if (cheatMenu.parentElement !== document.body) {
    const ejsColor = emulator.elements?.parent
      ? getComputedStyle(emulator.elements.parent).getPropertyValue('--ejs-primary-color')
      : '';
    if (ejsColor) document.body.style.setProperty('--ejs-primary-color', ejsColor);

  cheatMenu.style.display = 'block';
  cheatMenu.style.position = 'fixed';
  cheatMenu.style.inset = '0';
  cheatMenu.style.zIndex = '100000';
  cheatMenu.setAttribute('aria-modal', 'true');

  // O botão "Close" nativo altera display diretamente; mantém o estado visual
  // do RetroVault Web sincronizado quando isso acontecer.
  if (!cheatMenu.__rvCheatObserver) {
    const observer = new MutationObserver(() => {
      const visible = getComputedStyle(cheatMenu).display !== 'none';
      document.body.classList.toggle('rv-cheats-open', visible);
    });
    observer.observe(cheatMenu, { attributes: true, attributeFilter: ['style'] });
    cheatMenu.__rvCheatObserver = observer;

/* ── SISTEMA DE SAVES RETROVAULT WEB ───────────────────────────────────
   UM slot por jogo: "Salvar" sobrescreve o save anterior do mesmo jogo
   (a linha de info da barra deixa isso explícito e mostra data/tamanho).
   O estado completo do emulador (save-state) fica em IndexedDB próprio
   ("RetroVault-saves"), independente do menu nativo do EmulatorJS:
   o que a barra salva é exatamente o que a barra carrega. Saves gravados
   com o nome de banco antigo são migrados automaticamente (1x). */
const RV_SAVES_DB = 'RetroVault-saves';
const RV_SAVES_DB_LEGACY = 'RetroVerso-saves'; /* banco das versões antigas — só leitura p/ migração */
const RV_SAVES_STORE = 'saves';

function rvSavesOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(RV_SAVES_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(RV_SAVES_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB bloqueado'));
  });
}
function rvSavesOpenNamed(name) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(name); /* sem versão: nunca força upgrade */
    req.onupgradeneeded = () => { try { req.result.createObjectStore(RV_SAVES_STORE); } catch (e) { } };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function rvSavesGetAllRows(db) {
  return new Promise((resolve, reject) => {
    const out = [];
    try {
      const cursor = db.transaction(RV_SAVES_STORE, 'readonly').objectStore(RV_SAVES_STORE).openCursor();
      cursor.onsuccess = () => {
        const c = cursor.result;
        if (c) { out.push({ k: c.key, v: c.value }); c.continue(); }
        else resolve(out);
      };
      cursor.onerror = () => reject(cursor.error);
    } catch (e) { reject(e); }
  });
}
function rvSavesPutAllRows(db, rows) {
  return new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(RV_SAVES_STORE, 'readwrite');
      const st = tx.objectStore(RV_SAVES_STORE);
      rows.forEach(r => { try { st.put(r.v, r.k); } catch (e) { } });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    } catch (e) { reject(e); }
  });
}
/* Migração única do banco com nome antigo (espelha js/rv-account.js): copia
   os saves do banco legado para o novo nome, sem apagar o original. Roda 1x
   por navegador (flag rv_saves_db_migrated); falha = só pula, nunca quebra. */
async function rvMigrateSavesDbOnce() {
  if (!window.indexedDB) return;
  let flag = null;
  try { flag = localStorage.getItem('rv_saves_db_migrated'); } catch (e) { }
  if (flag === '1') return;
  const db = await rvSavesOpenNamed(RV_SAVES_DB);
  try {
    const current = await rvSavesGetAllRows(db).catch(() => []);
    if (current.length) return;
    /* Evita criar um banco legado vazio em navegadores novos. */
    if (window.indexedDB.databases) {
      const list = await window.indexedDB.databases().catch(() => null);
      const exists = !!(list && list.some(d => d && d.name === RV_SAVES_DB_LEGACY));
      if (!exists) return;
    }
    const oldDb = await rvSavesOpenNamed(RV_SAVES_DB_LEGACY).catch(() => null);
    if (!oldDb) return;
    const rows = await rvSavesGetAllRows(oldDb).catch(() => []);
    oldDb.close();
    if (rows.length) await rvSavesPutAllRows(db, rows).catch(() => { });
  } finally {
    try { db.close(); } catch (e) { }
    try { localStorage.setItem('rv_saves_db_migrated', '1'); } catch (e) { }
  }
}
let rvSavesDbMigratePromise = null;
function rvEnsureSavesDbMigrated() {
  if (!rvSavesDbMigratePromise) rvSavesDbMigratePromise = rvMigrateSavesDbOnce().catch(() => { /* best-effort */ });
  return rvSavesDbMigratePromise;
}
function rvSavesRun(mode, op) {
  return rvEnsureSavesDbMigrated().then(() => rvSavesOpen()).then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(RV_SAVES_STORE, mode);
    const req = op(tx.objectStore(RV_SAVES_STORE));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
    tx.onabort = () => { db.close(); reject(tx.error); };
  }));
}
const rvSaveGet = (key) => rvSavesRun('readonly', st => st.get(key));
const rvSavePut = (key, val) => rvSavesRun('readwrite', st => st.put(val, key));
const rvSaveDel = (key) => rvSavesRun('readwrite', st => st.delete(key));

// Identidade do save = usuário + core + "console/arquivo" (valor da URL do jogo).
// O prefixo do usuário garante que cada conta tenha o SEU save do mesmo jogo,
// e é a mesma chave usada na nuvem (Firestore) — o save segue a conta.
function rvSaveKey() {
  const file = decodeURIComponent(((typeof game === 'string' ? game : '') || '').split('?')[0]);
  const c = (typeof core === 'string' ? core : '?');
  return (window.RVAccount ? RVAccount.saveKeyFor(c, file) : c + '|' + file);
}
const rvCloudOn = () => !!(window.RVAccount && RVAccount.cloudEnabled() &&
  (RVAccount.config.sync || {}).saves !== false);
const rvGameLabel = () =>
  decodeURIComponent(((typeof game === 'string' ? game : '') || '').split('/').pop() || 'Jogo').replace(/\.[^/.]+$/, '');
const rvFmtBytes = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
const rvFmtDate = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

/* Congela/retoma o loop principal do núcleo por milissegundos, SEM mexer no
   botão de pausa do menu EJS. Congelar antes de LER o estado evita capturar
   um buffer "rasgado" em núcleos com thread própria — carregar um buffer
   desses depois é o que travava o jogo. Retorna true se pausou (p/ retomar). */
function rvFreezeCore() {
  try {
    const em = window.EJS_emulator;
    const gm = em && em.gameManager;
    if (!gm || typeof gm.toggleMainLoop !== 'function') return false;
    if (em.paused) return false; // já pausado: não mexe em nada
    gm.toggleMainLoop(0);
    return true;
  } catch (e) { return false; }
}
function rvUnfreezeCore() {
  try {
    const em = window.EJS_emulator;
    const gm = em && em.gameManager;
    if (!gm || typeof gm.toggleMainLoop !== 'function') return;
    if (em && em.paused) return; // usuário pausou no meio: respeita
    gm.toggleMainLoop(1);
  } catch (e) { /* o núcleo já cuidou de si */ }
}
const rvTick = (ms) => new Promise(r => setTimeout(r, ms));

async function rvSaveNow() {
  const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
  if (!gm || typeof gm.getState !== 'function') {
    if (typeof showToast === 'function') showToast('Este núcleo não suporta save-state', 'warning');
    return false;
  }
  /* Congela o núcleo antes de LER o estado e valida o buffer: states vazios
     ou inválidos são recusados em vez de sobrescrever um save bom. */
  const frozen = rvFreezeCore();
  let state;
  try {
    if (frozen) await rvTick(80); // deixa a thread do núcleo assentar
    state = await Promise.resolve(gm.getState());
  } finally {
    if (frozen) rvUnfreezeCore(); // o jogo volta no mesmo instante
  }
  try {
    const rawLen = state ? (state.byteLength || state.length || 0) : 0;
    if (!state || !rawLen) throw new Error('estado vazio');
    if (state instanceof Uint8Array) state = state.slice(); // cópia defensiva
    else if (state instanceof ArrayBuffer) state = new Uint8Array(state);
    else if (Array.isArray(state)) state = Uint8Array.from(state);
    if (!state.byteLength) throw new Error('estado vazio');
    const key = rvSaveKey();
    const prev = await rvSaveGet(key);
    const rec = {
      game: key, rom: rvGameLabel(), core: (typeof core === 'string' ? core : ''),
      bytes: state.byteLength || state.length || 0,
      savedAt: new Date().toISOString(), state
    };
    await rvSavePut(key, rec);
    if (typeof showToast === 'function') {
      showToast((prev ? 'Save substituído: ' : 'Save gravado: ') + rvFmtDate(rec.savedAt) + ' · ' + rvFmtBytes(rec.bytes), 'check');
    }
    refreshRvSaveInfo();
    // ─── Envio para a nuvem (não trava o jogo: roda em segundo plano) ───
    if (rvCloudOn() && (RVAccount.config.sync || {}).autoUploadSaves !== false) {
      RVAccount.uploadSave(key, rec).then(res => {
        if (res && res.ok) {
          if (typeof showToast === 'function') showToast('Save enviado para a sua conta', 'cloud');
        } else if (res && res.reason === 'too_big') {
          if (typeof showToast === 'function') showToast('Save grande demais para a nuvem — guardado só neste aparelho', 'warning');
        }
        refreshRvSaveInfo();
      }).catch(err => {
        console.warn('[RetroVault Web] upload do save falhou:', err);
        if (typeof showToast === 'function') showToast('Save local OK — nuvem indisponível agora', 'warning');
      });
    }
    return true;
  } catch (err) {
    console.warn('[RetroVault Web] falha ao gravar save:', err);
    if (typeof showToast === 'function') showToast('Falha ao gravar o save', 'warning');
    return false;
  }
}
window.rvSaveNow = rvSaveNow;

async function rvLoadNow() {
  const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
  if (!gm || typeof gm.loadState !== 'function') {
    if (typeof showToast === 'function') showToast('Este núcleo não suporta save-state', 'warning');
    return false;
  }
  try {
    const key = rvSaveKey();
    let rec = await rvSaveGet(key);
    // Sem save local? Tenta buscar na conta (outro PC/celular).
    if ((!rec || !rec.state) && rvCloudOn()) {
      if (typeof showToast === 'function') showToast('Buscando save na sua conta...', 'cloud');
      try {
        const cloud = await RVAccount.downloadSave(key);
        if (cloud && cloud.state) { rec = cloud; await rvSavePut(key, cloud); }
      } catch (e) { console.warn('[RetroVault Web] download do save falhou:', e); }
    }
    if (!rec || !rec.state) {
      if (typeof showToast === 'function') showToast('Nenhum save gravado para este jogo');
      return false;
    }
    const raw = rec.state;
    const rawLen = raw ? (raw.byteLength || raw.length || 0) : 0;
    if (!raw || !rawLen) {
      if (typeof showToast === 'function') showToast('Save inválido — grave novamente', 'warning');
      return false;
    }
    /* Normaliza o buffer e garante o loop rodando com uma folga antes de
       aplicar: núcleo "frio" + settle = o jogo volta sem travar. */
    const bytes = raw instanceof Uint8Array ? raw
      : ArrayBuffer.isView(raw) ? new Uint8Array(raw.buffer, raw.byteOffset, raw.byteLength)
      : new Uint8Array(raw);
    rvUnfreezeCore();
    await rvTick(120);
    await Promise.resolve(gm.loadState(bytes));
    await rvTick(60);
    rvUnfreezeCore();
    if (typeof showToast === 'function') showToast((rec.fromCloud ? 'Save da conta carregado (' : 'Save carregado (') + rvFmtDate(rec.savedAt) + ')', rec.fromCloud ? 'cloud' : 'check');
    return true;
  } catch (err) {
    console.warn('[RetroVault Web] falha ao carregar save:', err);
    try { rvUnfreezeCore(); } catch (e) { /* núcleo já tratado */ }
    if (typeof showToast === 'function') showToast('Falha ao carregar o save', 'warning');
    return false;
  }
}
window.rvLoadNow = rvLoadNow;

/* Atualiza a linha "Save deste jogo" com o que existe de fato no banco:
   data, tamanho e disponibilidade dos botões Carregar/Apagar. */
async function refreshRvSaveInfo() {
  const info = document.getElementById('rv-sys-save-info');
  const delBtn = document.getElementById('rv-sys-del');
  const loadBtn = document.querySelector('#rv-sys-bar [data-sys="load"]');
  if (!info) return;
  try {
    const rec = await rvSaveGet(rvSaveKey());
    if (rec && rec.state) {
      const cloudTag = rvCloudOn() ? (rec.cloudSynced === false ? ' · só neste aparelho' : ' · na conta') : '';
      info.textContent = 'Save deste jogo: ' + rvFmtDate(rec.savedAt) + ' · ' + rvFmtBytes(rec.bytes || (rec.state.byteLength || 0)) + cloudTag;
      if (delBtn) delBtn.hidden = false;
      if (loadBtn) loadBtn.classList.remove('rv-dim');
    } else if (rvCloudOn()) {
      info.textContent = 'Nenhum save neste aparelho — toque em Carregar para buscar na conta';
      if (delBtn) delBtn.hidden = true;
      if (loadBtn) loadBtn.classList.remove('rv-dim');
    } else {
      info.textContent = 'Nenhum save gravado neste jogo';
      if (delBtn) delBtn.hidden = true;
      if (loadBtn) loadBtn.classList.add('rv-dim');
    }
  } catch (e) {
    info.textContent = 'Saves indisponíveis neste navegador';
    if (delBtn) delBtn.hidden = true;
  }
}

function syncRvSysBarState() {
